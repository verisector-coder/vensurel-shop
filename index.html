<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZAMON</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══ ZAMON Design System — exact match to zamon.app ═══ */
:root{
  --bg:#fbfbfd;--bg-alt:#f5f5f7;--surface:#fff;
  --text:#1d1d1f;--text-2:#6e6e73;--text-3:#86868b;
  --accent:#0071e3;--accent-2:#0077ed;--ok:#1aa251;
  --border:rgba(0,0,0,.12);--border-2:rgba(0,0,0,.06);
  --shadow-sm:0 2px 10px rgba(0,0,0,.05);--shadow:0 8px 34px rgba(0,0,0,.09);
  --r:18px;--r-lg:28px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --nav-bg:rgba(251,251,253,.82);
}
html[data-theme="dark"]{
  --bg:#000;--bg-alt:#0b0b0d;--surface:#161617;
  --text:#f5f5f7;--text-2:#a1a1a6;--text-3:#7d7d82;
  --accent:#2997ff;--accent-2:#3aa0ff;
  --border:rgba(255,255,255,.16);--border-2:rgba(255,255,255,.08);
  --shadow-sm:0 2px 10px rgba(0,0,0,.4);--shadow:0 10px 40px rgba(0,0,0,.55);
  --nav-bg:rgba(22,22,23,.82);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.5;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
button,input{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
::-webkit-scrollbar{display:none}

/* ── Dock (= site mobile-dock) ── */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:1350;display:grid;grid-template-columns:repeat(4,1fr);
  min-height:62px;padding:4px 5px calc(4px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--border-2);
  box-shadow:0 -8px 26px rgba(0,0,0,.09);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.dock button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font:600 10px/1.05 Inter,system-ui,sans-serif;color:var(--text-3);transition:.15s}
.dock button.on{color:var(--accent)}
.dock svg{width:22px;height:22px}
.dock button:active{transform:scale(.92);transition:.06s}

/* ── Hero (= ru-hero) ── */
.hero{padding:26px 20px 20px;border-radius:0 0 22px 22px;
  background:linear-gradient(135deg,#0b1220,#12203c 55%,#0e2a4d);color:#fff}
.hero h1{font-size:clamp(22px,4vw,34px);font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.hero p{color:#c7d3e6;font-size:14px;margin-bottom:12px}
.hero-stats{display:flex;gap:16px}
.hero-stats b{display:block;font-size:18px;font-weight:800}
.hero-stats span{font-size:10px;color:#8ea3c4;font-weight:500}
.hero-tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.hero-tag{padding:4px 10px;border-radius:980px;font-size:11px;font-weight:700;
  background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.08)}

/* ── Section titles (= site eyebrow + h2) ── */
.pad{padding:14px 16px}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.sec-t{font-size:1.15rem;font-weight:700;letter-spacing:-.025em;margin-bottom:10px}
.sec-sub{color:var(--text-2);font-size:.85rem;margin-top:-6px;margin-bottom:10px}

/* ── Platform cards (= sc-card) ── */
.sc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc{position:relative;overflow:hidden;border-radius:18px;padding:16px;min-height:90px;color:#fff;
  border:1px solid rgba(255,255,255,.12);transition:transform .2s var(--ease)}
.sc:active{transform:scale(.96)}
.sc b{font-size:15px;font-weight:700;display:block;margin-bottom:2px}
.sc small{font-size:11px;opacity:.75}
.sc-ps{background:radial-gradient(120% 120% at 15% 0%,#1a6dff 0%,#0a2a6b 55%,#05122e 100%)}
.sc-st{background:radial-gradient(120% 120% at 15% 0%,#3a7bd5 0%,#1b2838 45%,#0b1220 100%)}
.sc-xb{background:radial-gradient(120% 120% at 15% 0%,#107C10 0%,#0e3a1a 50%,#08160c 100%)}
.sc-ai{background:radial-gradient(120% 120% at 15% 0%,#a071ff 0%,#5b21b6 55%,#2e1065 100%)}
.sc-rv{background:linear-gradient(135deg,#1b8f4a,#25b866)}
.sc-gc{background:linear-gradient(135deg,#ff6b3d 0%,#c8102e 100%)}

/* ── Game card (= gcard) ── */
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gc{background:var(--surface);border:1px solid var(--border-2);border-radius:16px;padding:10px;
  display:flex;flex-direction:column;position:relative;transition:transform .18s var(--ease);text-decoration:none;color:inherit}
.gc:active{transform:scale(.96)}
.gc-media{aspect-ratio:1/1;overflow:hidden;border-radius:12px;position:relative;
  background:linear-gradient(100deg,var(--bg-alt) 40%,color-mix(in srgb,var(--text) 7%,var(--bg-alt)) 50%,var(--bg-alt) 60%);background-size:200% 100%}
.gc-media img{width:100%;height:100%;object-fit:cover;border-radius:10px;display:block;opacity:0;transition:opacity .4s}
.gc-media img.ld{opacity:1}
.gc-plat{position:absolute;left:6px;bottom:6px;z-index:2;background:rgba(10,12,18,.66);
  backdrop-filter:saturate(140%) blur(4px);-webkit-backdrop-filter:saturate(140%) blur(4px);
  border:1px solid rgba(255,255,255,.1);color:#fff;font-size:.62rem;font-weight:700;letter-spacing:.04em;border-radius:6px;padding:2px 6px}
.gc-badge{position:absolute;top:6px;left:6px;z-index:2;padding:2px 7px;border-radius:6px;font-size:.72rem;font-weight:800;color:#fff}
.gc-sale{background:#e11d48}.gc-pre{background:#bf4800}.gc-new{background:var(--ok)}
.gc-fav{position:absolute;top:6px;right:6px;z-index:2;width:26px;height:26px;border-radius:50%;
  background:rgba(10,12,18,.45);backdrop-filter:blur(3px);display:grid;place-items:center;cursor:pointer;border:none;padding:0}
.gc-fav svg{width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2.2}
.gc-fav.on svg{fill:#ff375f;stroke:#ff375f}
.gc h3{font-size:.88rem;line-height:1.25;margin-top:8px;margin-bottom:2px;font-weight:650;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.2em}
.gc-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:4px}
.gc-foot b{font-size:.92rem;font-weight:700}
.gc-from{font-size:.74rem;color:var(--text-3);font-weight:500}
.gc-old{font-size:.78rem;text-decoration:line-through;color:var(--text-3);margin-right:3px}
.gc-buy{color:var(--accent);font-size:.78rem;font-weight:600}
.gc-timer{font-size:.68rem;color:#e11d48;font-weight:700;margin-top:2px}

/* ── Shelf (horizontal scroll = shelf-row) ── */
.shelf{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 8px;-webkit-overflow-scrolling:touch}
.shelf .gc{flex:0 0 150px;scroll-snap-align:start}

/* ── Chips / Filters (= acc-chip) ── */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 16px 8px}
.chip{padding:8px 16px;border-radius:999px;border:1px solid var(--border-2);background:var(--surface);
  color:var(--text-2);font-weight:500;font-size:.88rem;white-space:nowrap;flex-shrink:0;transition:.2s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
html[data-theme="dark"] .chip{background:#1b1d22;border-color:rgba(255,255,255,.15);color:#e8eaee}
html[data-theme="dark"] .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ── List item ── */
.li{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border-2);transition:.12s}
.li:active{background:color-mix(in srgb,var(--text) 4%,transparent)}
.li-ico{width:42px;height:42px;border-radius:12px;flex-shrink:0;object-fit:cover;background:var(--bg-alt)}
.li-info{flex:1;min-width:0}
.li-n{font-size:.88rem;font-weight:600}
.li-d{font-size:.75rem;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-p{font-weight:700;font-size:.88rem;text-align:right;white-space:nowrap}
.li-from{font-size:.68rem;color:var(--text-3);display:block}

/* ── Buttons (= btn) ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:1rem;
  padding:13px 26px;border-radius:980px;border:none;cursor:pointer;transition:.3s var(--ease);white-space:nowrap;width:100%}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff) 0%,var(--accent) 55%,var(--accent-2) 100%);
  color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 16px -6px color-mix(in srgb,var(--accent) 65%,transparent)}
.btn-soft{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);
  border:1px solid color-mix(in srgb,var(--accent) 20%,transparent)}

/* ── Product detail ── */
.pd-hero{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:0 0 16px 16px;background:var(--bg-alt)}
.pd-t{font-size:1.3rem;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:4px}
.pd-meta{font-size:.78rem;color:var(--text-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pd-desc{font-size:.82rem;color:var(--text-2);line-height:1.45;margin-bottom:14px}
.shots{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;-webkit-overflow-scrolling:touch}
.shots img{height:140px;border-radius:10px;flex-shrink:0}

/* ── ZSMART buy cards (= site zsmart) ── */
.zsmart{margin:10px 0;padding:14px;border:1px solid color-mix(in srgb,var(--accent) 24%,var(--border));
  border-radius:20px;background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface));
  box-shadow:0 14px 36px -30px color-mix(in srgb,var(--accent) 70%,#000)}
.zsmart-h{margin-bottom:10px}
.zsmart-h small{font-size:.68rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.zsmart-h b{display:block;font-size:.95rem;font-weight:700;margin-top:2px}
.zcard{position:relative;width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:8px;text-align:left;border:1.5px solid var(--border-2);border-radius:14px;padding:12px;
  background:var(--surface);color:var(--text);cursor:pointer;transition:.18s var(--ease);margin-bottom:6px}
.zcard:active{transform:scale(.98)}
.zcard.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 13%,transparent)}
.zcard b{font-size:.85rem;font-weight:700;display:block}
.zcard small{font-size:.72rem;color:var(--text-2);display:block;margin-top:1px}
.zcard strong{font-size:.92rem;font-weight:800}
.zcard em{position:absolute;right:9px;top:-8px;padding:2px 7px;border-radius:999px;
  background:var(--accent);color:#fff;font-size:.58rem;font-style:normal;font-weight:800}

/* ── P1 region list ── */
.p1-list{margin-top:8px}
.p1-opt{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1.5px solid var(--border-2);
  border-radius:12px;margin-bottom:5px;background:var(--surface);cursor:pointer;transition:.15s var(--ease)}
.p1-opt:active{transform:scale(.98)}
.p1-opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.p1-fl{font-size:1.1rem;flex-shrink:0}
.p1-n{flex:1;font-size:.82rem;font-weight:600}
.p1-p{font-weight:800;font-size:.85rem}

/* ── Trust row ── */
.trust{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.trust span{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:980px;
  font-size:.7rem;font-weight:600;background:color-mix(in srgb,var(--ok) 10%,transparent);color:var(--ok);
  border:1px solid color-mix(in srgb,var(--ok) 15%,transparent)}

/* ── Reviews ── */
.rv-banner{display:flex;align-items:center;gap:14px;padding:14px 18px;margin:8px 16px;border-radius:14px;
  background:linear-gradient(135deg,#1b8f4a,#25b866);color:#fff;box-shadow:0 6px 16px rgba(37,184,102,.28)}
.rv-rate{font-size:1.7rem;font-weight:900;line-height:1}
.rv{padding:12px 16px;border-bottom:1px solid var(--border-2)}
.rv-stars{color:#ffb400;font-size:.85rem;letter-spacing:1px}
.rv-text{font-size:.82rem;line-height:1.35;margin-top:3px}
.rv-meta{font-size:.72rem;color:var(--ok);font-weight:600;margin-top:3px}

/* ── Search ── */
.sbar{padding:8px 16px;position:sticky;top:0;z-index:50;background:var(--bg)}
.sinput{width:100%;padding:10px 14px;border-radius:12px;font-size:.88rem;
  background:var(--bg-alt);color:var(--text);border:1px solid var(--border-2)}
.sinput::placeholder{color:var(--text-3)}

/* ── Header ── */
.hdr{display:flex;align-items:center;gap:8px;padding:10px 16px;position:sticky;top:0;z-index:50;
  background:var(--nav-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border-2)}
.hdr-t{font-size:1.05rem;font-weight:700;flex:1;letter-spacing:-.02em}
.hdr-cnt{font-size:.78rem;color:var(--text-3)}

/* ── Misc ── */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text-3);gap:8px;font-size:.82rem}
.spin{width:18px;height:18px;border:2px solid var(--border-2);border-top-color:var(--accent);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:50px 20px;color:var(--text-3)}
.empty b{display:block;font-size:28px;margin-bottom:6px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--text);color:var(--bg);padding:8px 20px;border-radius:980px;font-weight:600;font-size:.82rem;
  z-index:9999;opacity:0;transition:.3s var(--ease);pointer-events:none;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.screen{display:none;min-height:100vh}.screen.on{display:block}

/* ── ZAMON Updates ── */
.hdr-back{padding:6px;display:flex;align-items:center;cursor:pointer;background:none;border:none}
.hdr-back svg{width:20px;height:20px}

/* Platform Cards */
.sc-full{position:relative;overflow:hidden;border-radius:24px;padding:26px;margin-bottom:14px;color:#fff;
  display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.12);isolation:isolate;cursor:pointer;transition:transform .2s var(--ease)}
.sc-full:active{transform:scale(.96)}
.sc-full .sc-glow{position:absolute;inset:0;background:radial-gradient(60% 60% at 82% 18%,rgba(255,255,255,.20),transparent 70%);z-index:-1}
.sc-full b{font-size:1.15rem;font-weight:800;display:block}
.sc-full .sc-sub{opacity:.9;margin-top:4px;font-size:.82rem;line-height:1.35}
.sc-full .sc-feats{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.sc-full .sc-feats li{font-size:.78rem;opacity:.88;display:flex;align-items:center;gap:6px}
.sc-full .sc-feats li::before{content:'✓';color:#4ade80;font-weight:700;flex-shrink:0}
.sc-full .sc-covers{display:flex;gap:6px;margin-top:12px}
.sc-full .sc-covers img{width:56px;height:56px;border-radius:10px;object-fit:cover;border:1px solid rgba(255,255,255,.15);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.sc-full .sc-cta{margin-top:14px;font-size:.85rem;font-weight:700;opacity:.9}

/* Reviews Wall */
.rev-wall{margin-top:16px}
.rev-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px;padding:0 16px}
.rev-sub{color:var(--text-2);font-size:.82rem;margin:4px 0 0}
.rev-grid{display:grid;grid-template-columns:1fr;gap:8px;padding:0 16px}
.rev-card{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--border-2);border-radius:14px;padding:12px 14px}
.rev-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rev-stars{color:#ffb400;font-size:.85rem;letter-spacing:1px}
.rev-game{font-size:.7rem;color:var(--text-2);background:color-mix(in srgb,var(--text) 6%,transparent);border-radius:999px;padding:2px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.rev-text{margin:0;font-size:.82rem;line-height:1.35;color:var(--text)}
.rev-src{display:flex;align-items:center;gap:4px;font-size:.7rem;color:#1b8f4a;font-weight:600}
.rev-cta{text-align:center;margin-top:8px;padding:0 16px}

/* Footer */
.app-footer{padding:24px 16px 20px;text-align:center;color:var(--text-3);font-size:.75rem;line-height:1.6}
.app-footer b{color:var(--text-2);font-weight:700}

/* Filters & Promo */
.sort-select{padding:6px 10px;border-radius:10px;font-size:.82rem;font-weight:600;border:1px solid var(--border-2);background:var(--surface);color:var(--text);appearance:auto}
.deal-banner{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 16px 8px;border-radius:14px;background:linear-gradient(135deg,#e11d48,#be123c);color:#fff}
.deal-pct{font-size:1.4rem;font-weight:900}
.deal-banner b{display:block;font-size:.88rem}
.deal-banner small{font-size:.75rem;opacity:.8}
.promo-car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px 6px;-webkit-overflow-scrolling:touch;margin-bottom:4px}
.promo-car::-webkit-scrollbar{display:none}
.promo-slide{flex:0 0 85%;scroll-snap-align:start;border-radius:16px;padding:18px 20px;color:#fff;cursor:pointer;min-height:90px;display:flex;flex-direction:column;justify-content:center;transition:transform .2s var(--ease),opacity .2s}
.promo-slide:active{opacity:.9;transform:scale(.98)}
.promo-slide b{font-size:1.1rem;font-weight:800}
.promo-slide div{font-size:.85rem;font-weight:600;margin-top:2px}
.promo-slide small{font-size:.75rem;opacity:.75;margin-top:4px}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--border-2);border-radius:14px;background:var(--surface)}
.step-n{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem;flex-shrink:0}
.step b{font-size:.88rem;font-weight:700;display:block}
.step small{font-size:.75rem;color:var(--text-2)}
/* Tabs */
.tabs{display:flex;border-bottom:2px solid var(--border-2);margin-bottom:0}
.tab{flex:1;padding:12px 8px;text-align:center;font-size:.85rem;font-weight:600;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:.2s}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
</style>
</head>
<body>
<div id="s-home" class="screen on"></div>
<div id="s-ps" class="screen"></div>
<div id="s-steam" class="screen"></div>
<div id="s-xbox" class="screen"></div>
<div id="s-subs" class="screen"></div>
<div id="s-gifts" class="screen"></div>
<div id="s-reviews" class="screen"></div>
<div id="s-product" class="screen"></div>
<div id="s-search" class="screen"></div>
<div id="s-favs" class="screen"></div>

<nav class="dock">
  <button class="on" onclick="Z.tab('home')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>Главная</button>
  <button onclick="Z.tab('ps')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Каталог</button>
  <button onclick="Z.tab('search')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>Поиск</button>
  <button onclick="Z.tab('favs')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>Избранное</button>
</nav>
<div id="toast" class="toast"></div>

<script>
const tg=window.Telegram?.WebApp,CDN='https://zamon.app',BOT='TarkonGameBot';

/* ═══ Pricing = zamon.js ═══ */
const DG={p2:{l:'П2',d:'Общий аккаунт · онлайн',k:.30},p3:{l:'П3',d:'Онлайн + оффлайн',k:.61},p1:{l:'П1',d:'На ваш аккаунт · навсегда',k:1.25}};
const P1R=[['ua','🇺🇦','Украина'],['tr','🇹🇷','Турция'],['in','🇮🇳','Индия'],['pl','🇵🇱','Польша'],['us','🇺🇸','США']];
const RC={ua:'UAH',tr:'TRY',in:'INR',pl:'PLN',us:'USD'},INR_B=1000/13;
const SUBS=[
  {n:'ChatGPT',d:'Go · Plus · Pro',img:'/img/subs/chatgpt.png',u:'/podpiska-chatgpt',from:669},
  {n:'Claude',d:'Pro · Max 5x · Max 20x',img:'/img/subs/claude.png',u:'/podpiska-claude',from:2279},
  {n:'Midjourney',d:'Генерация изображений',img:'/img/subs/midjourney.png',u:'/podpiska-midjourney',from:1199},
  {n:'Cursor',d:'AI-помощник для кода',img:'/img/subs/cursor.png',u:'/podpiska-cursor',from:2279},
  {n:'Perplexity',d:'AI-поисковик Pro',img:'/img/subs/perplexity.png',u:'/podpiska-perplexity',from:2279},
  {n:'Spotify Premium',d:'Музыка без рекламы',img:'/img/subs/spotify.png',u:'/subs',from:199},
  {n:'Telegram Premium',d:'Подписка',img:'/img/subs/telegram.png',u:'/subs',from:299},
  {n:'YouTube Premium',d:'Без рекламы + Music',img:'/img/subs/youtube.png',u:'/subs',from:199},
];

/* ═══ State ═══ */
const Z={scr:'home',hist:[],favs:new Set(),UAH_RUB:1.78,
  RATES:{USD:1,RUB:80,UAH:45,TRY:47.5,INR:95,PLN:3.74},
  ps:null,psD:null,psDeals:null,steam:null,shelves:null,xbox:null,reviews:null,si:null,
  _mb:null,sel:{plan:'p2',ed:0,cons:'PS5',reg:0,pid:null},psTab:'games',_ppTier:'essential',_ppDur:1,_ppMode:'p3',
  cur:'RUB',CUR_RATES:{RUB:1,KZT:5.55,UZS:155,TJS:0.135},CUR_SYM:{RUB:'₽',KZT:'₸',UZS:'сўм',TJS:'сом.'}};

/* ═══ Helpers ═══ */
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fmt=p=>{if(p==null)return'—';const r=Math.round(p*Z.CUR_RATES[Z.cur]);return r.toLocaleString('ru-RU')+' '+Z.CUR_SYM[Z.cur];};
const hap=s=>{try{tg?.HapticFeedback?.impactOccurred(s||'light')}catch(e){}};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)};

/* Pricing = site formulas */
Z.dgP=(uah,k)=>Math.max(300,Math.round(uah*Z.UAH_RUB*k/10)*10);
Z.p1P=(loc,rk,m)=>{const rc=RC[rk];if(!loc||!rc||!Z.RATES[rc])return null;const r=rc==='INR'?INR_B:Z.RATES[rc];return Math.max(300,Math.round(loc/r*1.25*(m||1)*Z.RATES.RUB/10)*10)};
Z.zmn=(id,pl,ei,c)=>'https://pay.zamon.app/zpay?c=zmn_'+id+'_'+pl+'_'+(ei||0)+'_'+(c==='PS4'?'ps4':'ps5');

/* ═══ Init ═══ */
Z.init=()=>{
  if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes?.()}catch(e){}try{tg.requestFullscreen?.()}catch(e){}
    const dk=tg.colorScheme==='dark';document.documentElement.dataset.theme=dk?'dark':'light';
    tg.onEvent('themeChanged',()=>{document.documentElement.dataset.theme=tg.colorScheme==='dark'?'dark':'light'});
    try{tg.setHeaderColor(dk?'#000000':'#fbfbfd');tg.setBackgroundColor(dk?'#000000':'#fbfbfd');tg.setBottomBarColor?.(dk?'#161617':'#ffffff')}catch(e){}
    tg.BackButton.onClick(()=>Z.back());
    tg.CloudStorage?.getItem('zfav',(e,v)=>{if(v)try{Z.favs=new Set(JSON.parse(v))}catch(x){}});
  }else{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
  Z.show('home');Z.loadRates();Z.loadPS();Z.loadSI();
  Z.loadRev().then(()=>{if(Z.scr==='home')Z.rHome()});
  Z.loadSteam().then(()=>{if(Z.scr==='home')Z.rHome()});
  Z.loadXbox().then(()=>{if(Z.scr==='home')Z.rHome()});};

Z.loadRates=async()=>{try{const d=await(await fetch('https://open.er-api.com/v6/latest/USD')).json();
  if(d?.rates){const r=d.rates;['RUB','UAH','TRY','INR','PLN'].forEach(c=>{if(r[c])Z.RATES[c]=r[c]});if(r.RUB&&r.UAH)Z.UAH_RUB=r.RUB/r.UAH}}catch(e){}};
Z.fetchJ=async u=>{try{return await(await fetch(u)).json()}catch(e){try{return await(await fetch('https://corsproxy.io/?'+encodeURIComponent(u))).json()}catch(e2){return null}}};
Z.loadS=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
Z.loadPS=async()=>{if(Z.ps)return;const c=await Z.fetchJ(CDN+'/ru-catalog.json');Z.ps=c?.games||c||{};
  Z.fetchJ(CDN+'/ps-plus-deals.json').then(d=>{Z.psDeals=d}).catch(()=>{});
  Z.fetchJ(CDN+'/games-data.json').then(d=>{Z.psD=d;if(Z.scr==='home')Z.show('home')}).catch(()=>{})};
Z.loadSteam=async()=>{if(Z.steam)return;try{await Z.loadS(CDN+'/steam-catalog.js');Z.steam=window.CATALOG||{};Z.shelves=window.SHELVES||{}}catch(e){Z.steam={}}};
Z.loadXbox=async()=>{if(Z.xbox)return;try{await Z.loadS(CDN+'/xbox-catalog.js');Z.xbox=window.XBOX||{}}catch(e){Z.xbox={}}};
Z.loadSI=async()=>{Z.si=await Z.fetchJ(CDN+'/search-index.json');Z.si=Z.si?.items||[]};
Z.loadRev=async()=>{if(Z.reviews)return;Z.reviews=await Z.fetchJ(CDN+'/reviews.json')};

/* ═══ Nav ═══ */
Z.go=(s,p)=>{Z.hist.push({s:Z.scr,y:scrollY,p:Z._lp});Z._lp=p;Z.show(s,p)};
Z.show=(s,p)=>{document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));Z.scr=s;
  const el=$('s-'+s);if(el)el.classList.add('on');
  ({home:Z.rHome,ps:Z.rPS,steam:Z.rSteam,xbox:Z.rXbox,subs:Z.rSubs,gifts:Z.rGifts,reviews:Z.rRev,
    product:()=>Z.rProd(p),search:Z.rSearch,favs:Z.rFavs})[s]?.();
  scrollTo(0,0);Z.hideM();tg?.BackButton?.[Z.hist.length?'show':'hide']()};
Z.back=()=>{if(!Z.hist.length)return;const h=Z.hist.pop();Z._lp=h.p;Z.show(h.s,h.p);setTimeout(()=>scrollTo(0,h.y),20)};
Z.tab=t=>{Z.hist=[];Z.show(t==='favs'?'favs':t==='search'?'search':t==='ps'?'ps':'home');
  document.querySelectorAll('.dock button').forEach((b,i)=>b.classList.toggle('on',['home','ps','search','favs'][i]===t));tg?.BackButton?.hide()};
Z.showM=(t,cb)=>{if(!tg?.MainButton)return;tg.MainButton.setText(t);tg.MainButton.show();if(Z._mb)tg.MainButton.offClick(Z._mb);tg.MainButton.onClick(cb);Z._mb=cb};
Z.hideM=()=>{if(!tg?.MainButton)return;tg.MainButton.hide();if(Z._mb){tg.MainButton.offClick(Z._mb);Z._mb=null}};

/* ═══ Favs ═══ */
Z.isFav=k=>Z.favs.has(k);
Z.toggleFav=(k,ev)=>{ev?.stopPropagation();ev?.preventDefault();const h=Z.favs.has(k);h?Z.favs.delete(k):Z.favs.add(k);
  hap('medium');toast(h?'Убрано':'❤️ В избранном');document.querySelectorAll(`[data-fk="${k}"]`).forEach(b=>{b.classList.toggle('on',!h);const sv=b.querySelector('svg');if(sv){sv.setAttribute('fill',!h?'#ff375f':'none');sv.setAttribute('stroke',!h?'#ff375f':'#fff')}});
  const j=JSON.stringify([...Z.favs]);tg?.CloudStorage?tg.CloudStorage.setItem('zfav',j):localStorage.setItem('zfav',j)};

/* ═══ Card builders ═══ */
Z.timer=end=>{const ms=end*1000-Date.now();if(ms<=0)return'';const h=Math.floor(ms/36e5),d=Math.floor(h/24);return d>3?d+' дн':d>=1?d+'д '+h%24+'ч':h+'ч'};

Z.psC=(id,g)=>{const isPre=!!g.pre,minK=isPre?.61:.30,minP=Z.dgP(g.uah,minK),deal=g.deal&&g.deal.end*1000>Date.now(),dp=deal?Z.dgP(g.deal.disc,minK):null,
  pct=deal?Math.round((1-g.deal.disc/g.deal.full)*100):0,img=Z.psD?.[id]?.edimg?.['0']||Z.psD?.[id]?.hero||Z.psD?.[id]?.shots?.[0]||'',tm=deal?Z.timer(g.deal.end):'';
  return`<div class="gc" onclick="Z.go('product',{t:'ps',id:'${id}'})">
    <div class="gc-media">${img?`<img src="${img}" loading="lazy" onload="this.classList.add('ld')" onerror="this.style.display='none'">`:''}
      <span class="gc-plat">${g.ps4?'PS4 · PS5':'PS5'}</span>
      ${deal?`<span class="gc-badge gc-sale">-${pct}%</span>`:''}${g.pre?'<span class="gc-badge gc-pre">ПРЕДЗАКАЗ</span>':''}
      <button class="gc-fav${Z.isFav('ps_'+id)?' on':''}" data-fk="ps_${id}" onclick="Z.toggleFav('ps_${id}',event)"><svg viewBox="0 0 24 24" fill="${Z.isFav('ps_'+id)?'#ff375f':'none'}" stroke="${Z.isFav('ps_'+id)?'#ff375f':'#fff'}" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg></button></div>
    <h3>${esc(g.n)}</h3><div class="gc-foot"><b>${deal?`<span class="gc-old">${fmt(minP)}</span>`:''}<span class="gc-from">от </span>${fmt(dp||minP)}</b><span class="gc-buy">Выбрать →</span></div>
    ${tm?`<div class="gc-timer">⏱ ${tm}</div>`:''}</div>`};

Z.stC=(id,g)=>`<div class="gc" onclick="Z.go('product',{t:'st',id:'${id}'})">
  <div class="gc-media"><img src="${g.cap||g.header}" loading="lazy" onload="this.classList.add('ld')" onerror="this.style.display='none'">
    ${g.steam_disc>0?`<span class="gc-badge gc-sale">-${g.steam_disc}%</span>`:''}<span class="gc-plat">STEAM</span>
    <button class="gc-fav${Z.isFav('st_'+id)?' on':''}" data-fk="st_${id}" onclick="Z.toggleFav('st_${id}',event)"><svg viewBox="0 0 24 24" fill="${Z.isFav('st_'+id)?'#ff375f':'none'}" stroke="${Z.isFav('st_'+id)?'#ff375f':'#fff'}" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg></button></div>
  <h3>${esc(g.name)}</h3><div class="gc-foot"><b>${fmt(g.price)}</b><span class="gc-buy">Выбрать →</span></div></div>`;

/* ═══ Screens ═══ */
Z._promoSlides=()=>{
  const slides=[];
  if(Z.ps){
    const now=Date.now();let maxPct=0;
    for(const id of Object.keys(Z.ps)){
      const g=Z.ps[id];if(g.deal&&g.deal.end*1000>now){
        const pct=Math.round((1-g.deal.disc/g.deal.full)*100);if(pct>maxPct)maxPct=pct;
      }
    }
    if(maxPct>0)slides.push({bg:'linear-gradient(135deg,#e11d48,#9f1239)',
      html:`<b style="font-size:1.3rem">-${maxPct}%</b><div>Скидки PS Store</div><small>Успей купить →</small>`,
      action:`Z.go('ps');setTimeout(()=>{Z.psFilt='deals';Z.rPS()},100)`});
  }
  slides.push({bg:'linear-gradient(135deg,#1a6dff,#0a2a6b)',
    html:`<b>PS Plus</b><div>от ${fmt(Z.dgP(799,.61))}/мес</div><small>Essential · Extra · Deluxe</small>`,
    action:`Z.go('ps');setTimeout(()=>{Z.psTab='plus';Z.rPS()},100)`});
  slides.push({bg:'linear-gradient(135deg,#7c3aed,#4c1d95)',
    html:`<b>AI-подписки</b><div>ChatGPT · Claude · Midjourney</div><small>от 669 ₽</small>`,
    action:`Z.go('subs')`});
  return slides;
};

Z.rHome=()=>{
  const n=Z.ps?Object.keys(Z.ps).length:'…';
  let dealsH='',hitsH='';
  if(Z.ps){const ids=Object.keys(Z.ps),now=Date.now();
    const dIds=ids.filter(id=>{const g=Z.ps[id];return g.deal&&g.deal.end*1000>now}).slice(0,10);
    if(dIds.length)dealsH=`<div class="pad"><div class="eyebrow">СКИДКИ</div><div class="sec-t">🔥 Скидки PS Store</div></div><div class="shelf">${dIds.map(id=>Z.psC(id,Z.ps[id])).join('')}</div>`;
    hitsH=`<div class="pad"><div class="eyebrow">ПОПУЛЯРНОЕ</div><div class="sec-t">🏆 Хиты PlayStation</div></div><div class="shelf">${ids.slice(0,12).map(id=>Z.psC(id,Z.ps[id])).join('')}</div>`}
  
  const promoH = Z._promoSlides ? `<div class="promo-car">${Z._promoSlides().map(s=>`<div class="promo-slide" style="background:${s.bg}" onclick="${s.action}">${s.html}</div>`).join('')}</div>` : '';

  const psCovers = Z.psD ? Object.keys(Z.psD).slice(0,4).map(id => Z.psD[id]?.edimg?.['0'] || Z.psD[id]?.hero || '').filter(Boolean) : [];
  const stCovers = Z.steam ? Object.keys(Z.steam).slice(0,4).map(id => Z.steam[id]?.cap || Z.steam[id]?.header || '').filter(Boolean) : [];
  const xbCovers = Z.xbox?.games ? Z.xbox.games.slice(0,4).map(g => g?.cover || g?.hero || '').filter(Boolean) : [];

  const rvH = Z.reviews?.items ? `<div class="rev-wall">
      <div class="rev-head">
        <div><div class="eyebrow">НАМ ДОВЕРЯЮТ</div><div class="sec-t" style="margin-bottom:0">⭐ 5.0</div></div>
        <div class="rev-sub">16 000+ отзывов<br>FunPay + Авито</div>
      </div>
      <div class="rev-grid">
        ${Z.reviews.items.slice(0,4).map(i=>`<div class="rev-card"><div class="rev-top"><div class="rev-stars">${'★'.repeat(i.stars)}</div><div class="rev-src">✓ FunPay</div></div><div class="rev-text">${esc(i.text)}</div></div>`).join('')}
      </div>
      <div class="rev-cta"><button class="btn btn-soft" onclick="Z.go('reviews')">Все отзывы →</button></div>
    </div>` : '';

  const stepsH = `<div class="pad">
    <div class="eyebrow">КАК КУПИТЬ</div>
    <div class="sec-t">3 простых шага</div>
    <div class="steps">
      <div class="step"><span class="step-n">1</span><div><b>Выберите игру</b><small>Любая платформа и издание</small></div></div>
      <div class="step"><span class="step-n">2</span><div><b>Оплатите</b><small>Картой, СБП или USDT</small></div></div>
      <div class="step"><span class="step-n">3</span><div><b>Получите за 10–15 мин</b><small>Прямо в Telegram</small></div></div>
    </div>
  </div>`;

  let mixedH='';
  if(Z.ps){
    const psIds=Object.keys(Z.ps).slice(0,5);
    const stIds=Z.steam?Object.keys(Z.steam).slice(0,5):[];
    const mx=[...psIds.map(id=>({id,t:'ps'})),...stIds.map(id=>({id,t:'st'}))].sort(()=>Math.random()-.5);
    mixedH=`<div class="pad"><div class="eyebrow">ПОПУЛЯРНОЕ</div><div class="sec-t">🔥 Хиты</div></div>
      <div class="shelf">${mx.map(i=>i.t==='ps'?Z.psC(i.id,Z.ps[i.id]):Z.stC(i.id,Z.steam[i.id])).join('')}</div>`;
  }

  $('s-home').innerHTML= promoH + `
    <div class="hero"><h1>ZAMON</h1><p>Игры, подписки и пополнения дешевле · выдача 10–60 мин</p>
      <div class="hero-stats"><div><b>${n}</b><span>PS игр</span></div><div><b>550+</b><span>Steam</span></div><div><b>16 000+</b><span>отзывов</span></div></div>
      <div class="hero-tags"><span class="hero-tag">⚡ 10–60 мин</span><span class="hero-tag">🛡 Гарантия</span><span class="hero-tag">💳 СБП · USDT</span></div></div>
    <div class="pad"><div class="eyebrow">ПЛАТФОРМЫ</div><div class="sec-t">Выберите платформу</div>
      <div class="sc-full" style="background:radial-gradient(120% 120% at 15% 0%,#1a6dff 0%,#0a2a6b 55%,#05122e 100%)" onclick="Z.go('ps')">
        <div class="sc-glow"></div>
        <b>PlayStation</b>
        <div class="sc-sub">${n} игр · от 300 ₽</div>
        <ul class="sc-feats"><li>Цифра на ваш аккаунт (П1/П2/П3)</li><li>Выдача за 10–15 минут</li></ul>
        ${psCovers.length ? `<div class="sc-covers">${psCovers.map(img=>`<img src="${img}" onerror="this.style.display='none'">`).join('')}</div>` : ''}
        <div class="sc-cta">Открыть PlayStation →</div>
      </div>
      <div class="sc-full" style="background:radial-gradient(120% 120% at 15% 0%,#3a7bd5 0%,#1b2838 45%,#0b1220 100%)" onclick="Z.go('steam')">
        <div class="sc-glow"></div>
        <b>Steam / ПК</b>
        <div class="sc-sub">550+ игр · Автодоставка</div>
        <ul class="sc-feats"><li>Гифты и ключи (Россия, СНГ, Турция)</li><li>Моментальная доставка</li></ul>
        ${stCovers.length ? `<div class="sc-covers">${stCovers.map(img=>`<img src="${img}" onerror="this.style.display='none'">`).join('')}</div>` : ''}
        <div class="sc-cta">Открыть Steam →</div>
      </div>
      <div class="sc-full" style="background:radial-gradient(120% 120% at 15% 0%,#107C10 0%,#0e3a1a 50%,#08160c 100%)" onclick="Z.go('xbox')">
        <div class="sc-glow"></div>
        <b>Xbox</b>
        <div class="sc-sub">Game Pass + Игры</div>
        <ul class="sc-feats"><li>Подписки и игры на ваш аккаунт</li><li>Выдача за 10–15 минут</li></ul>
        ${xbCovers.length ? `<div class="sc-covers">${xbCovers.map(img=>`<img src="${img}" onerror="this.style.display='none'">`).join('')}</div>` : ''}
        <div class="sc-cta">Открыть Xbox →</div>
      </div>
      <div class="sc-grid">
        <div class="sc sc-ai" onclick="Z.go('subs')"><b>AI-подписки</b><small>ChatGPT · Claude</small></div>
        <div class="sc sc-gc" onclick="Z.go('gifts')"><b>Подарочные карты</b><small>Apple · Google</small></div>
      </div>
    </div>
    ${stepsH}
    ${mixedH}
    ${rvH}
    ${dealsH}
    <div class="pad"><div class="eyebrow">СЕРВИСЫ</div><div class="sec-t">🤖 AI-подписки</div>
      ${SUBS.map(s=>`<div class="li" onclick="Z.openS('${s.u}')"><img class="li-ico" src="${CDN}${s.img}" loading="lazy" onerror="this.style.display='none'"><div class="li-info"><div class="li-n">${esc(s.n)}</div><div class="li-d">${esc(s.d)}</div></div><div class="li-p"><div class="li-from">от</div>${fmt(s.from)}</div></div>`).join('')}
      <button class="btn btn-soft" style="margin-top:12px" onclick="Z.go('subs')">Все подписки →</button>
    </div>
    <div class="app-footer"><b>ZAMON · 7 лет на рынке</b><br>⚡ Выдача 10–15 мин · 🛡 Гарантия возврата<br>💳 Карта · СБП · USDT
      <div class="cur-toggle" style="margin-top:8px">

  const d=Z.psD?.[id]||{},hero=d.hero||d.shots?.[0]||d.edimg?.['0']||'',eds=g.eds||[['Standard',g.uah]],isPre=!!g.pre;
  Z.sel={plan:isPre?'p3':'p2',ed:0,cons:'PS5',rk:'ua',reg:0,pid:id};
  const u0=eds[0][1],p2=Z.dgP(u0,.30),p3=Z.dgP(u0,.61);
  /* P1 options */
  const p1Opts=P1R.map(([rk,fl,rn])=>{const loc=d.reg?.[rk],p=loc!=null?Z.p1P(loc,rk):rk==='ua'?Z.dgP(u0,1.25):null;return p?{rk,fl,rn,p}:null}).filter(Boolean);
  Z._p1Opts=p1Opts;

  const deal=g.deal&&g.deal.end*1000>Date.now();
  const dealBanner = deal ? `<div class="deal-banner"><span class="deal-pct">-${Math.round((1-g.deal.disc/g.deal.full)*100)}%</span><div><b>Скидка в PS Store</b><small>Осталось ${Z.timer(g.deal.end)}</small></div></div>` : '';

  const videoH = d.video ? `<div style="margin:8px 16px"><a href="${d.video}" target="_blank" style="display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--border-2);border-radius:14px;background:var(--surface)"><span style="font-size:1.5rem">▶️</span><div><b style="font-size:.85rem">Смотреть трейлер</b><br><small style="font-size:.72rem;color:var(--text-2)">YouTube</small></div></a></div>` : '';

  const edDesc = {
    'Standard': 'Базовая версия игры',
    'Deluxe': 'Доп. контент и бонусы',
    'Ultimate': 'Все DLC и сезонный пропуск',
    'Premium': 'Максимальное издание',
    'Gold': 'Игра + сезонный пропуск',
    'Digital Deluxe': 'Цифровые бонусы'
  };

  el.innerHTML=`<div>${hero?`<img class="pd-hero" src="${hero}" loading="lazy" onerror="this.style.display='none'">`:''}${videoH}<div class="pad">
    <div class="pd-t">${esc(g.n)}</div>
    <div class="pd-meta"><span>${g.ps4?'PS4 · PS5':'PS5'}</span>${d.mode?`<span>· ${d.mode}</span>`:''}</div>
    ${d.desc?`<div class="pd-desc">${esc(d.desc)}</div>`:''}</div>
    ${dealBanner}
    ${(d.shots||[]).length?`<div class="shots">${d.shots.slice(0,6).map(s=>`<img src="${s}" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>${d.shots.length>1?`<div style="text-align:center;font-size:.72rem;color:var(--text-3);padding:2px 0">${Math.min(d.shots.length,6)} скриншотов · листайте →</div>`:''}`:''}
    <div class="pad">
      ${eds.length>1?`<div class="eyebrow">ИЗДАНИЕ</div>${eds.map((e,i)=>{
        const desc = d.edinfo?.[e[0]] || edDesc[e[0]] || 'Специальное издание';
        return `<div class="zcard${i===0?' on':''}" onclick="Z._pEd(${i},this)"><div style="flex:1"><b>${esc(e[0])}</b><small>${esc(desc)}</small></div><strong>${fmt(Z.dgP(e[1],.30))}</strong></div>`
      }).join('')}<div style="height:10px"></div>`:''}

      <div class="zsmart"><div class="zsmart-h"><small>ZAMON SMART BUY</small><b>Как вам удобнее получить игру?</b></div>
        <div class="zcard${Z.sel.plan==='p3'?' on':''}" onclick="Z._pPl('p3',this)">${!isPre?'<em>Рекомендуем</em>':''}
          <div><b>Играть со своего профиля</b><small>П3 · онлайн + оффлайн</small></div><strong>${fmt(p3)}</strong></div>
        ${!isPre?`<div class="zcard${Z.sel.plan==='p2'?' on':''}" onclick="Z._pPl('p2',this)">
          <div><b>Нужна самая низкая цена</b><small>П2 · общий аккаунт, нужен интернет</small></div><strong>${fmt(p2)}</strong></div>`:''}
      </div>

      ${p1Opts.length?`<div style="margin-top:6px"><div class="eyebrow">НА ВАШ АККАУНТ</div><div class="sec-t" style="font-size:.95rem">🔑 П1 — навсегда на ваш аккаунт</div>
        <div class="p1-list" id="p1l">${p1Opts.map((o,i)=>`<div class="p1-opt" onclick="Z._pP1(${i},this)"><span class="p1-fl">${o.fl}</span><span class="p1-n">${esc(o.rn)}</span><span class="p1-p">${fmt(o.p)}</span></div>`).join('')}</div></div>`:''}

      ${g.ps4?`<div style="margin-top:10px"><div class="eyebrow">КОНСОЛЬ</div>
        <div class="chips"><button class="chip on" onclick="Z.sel.cons='PS5';this.parentElement.querySelectorAll('.chip').forEach((e,i)=>e.classList.toggle('on',i===0));hap()">PS5</button><button class="chip" onclick="Z.sel.cons='PS4';this.parentElement.querySelectorAll('.chip').forEach((e,i)=>e.classList.toggle('on',i===1));hap()">PS4</button></div></div>`:''}

      <div class="trust"><span>⚡ Выдача 10–15 мин</span><span>🛡 Гарантия возврата</span><span>💬 Поддержка</span></div>
      ${d.dlc?.length ? `<div style="margin-top:16px">
        <div class="eyebrow">ДОПОЛНЕНИЯ</div>
        <div class="sec-t">🧩 DLC к ${esc(g.n)}</div>
        ${d.dlc.slice(0,6).map(dlc => `<div class="li" onclick="Z.go('product',{t:'ps',id:'${dlc.id}'})" style="padding:10px 0"><div class="li-info"><div class="li-n">${esc(dlc.n)}</div></div><div class="li-p">${fmt(Z.dgP(dlc.uah||0,.30))}</div></div>`).join('')}
      </div>` : ''}
      ${(()=>{const related = Z.ps ? Object.entries(Z.ps).filter(([rid,rg]) => rid !== id && rg.ps4 === g.ps4).slice(0,4) : [];
        return related.length ? `<div style="margin-top:16px">
        <div class="eyebrow">ПОХОЖИЕ</div><div class="sec-t" style="margin-bottom:10px">Вам может понравиться</div>
        <div class="shelf" style="padding:0;margin:0 -16px;padding:0 16px">${related.map(([rid,rg]) => Z.psC(rid,rg)).join('')}</div>
      </div>` : ''})()}
    </div></div>`;
  Z.showM('Купить — '+fmt(Z._cp()),()=>Z.buyPS())};

Z._cp=()=>{const s=Z.sel,g=Z.ps?.[s.pid],d=Z.psD?.[s.pid]||{};if(!g)return 0;const eds=g.eds||[['Standard',g.uah]],uah=eds[s.ed]?.[1]||eds[0][1];
  if(s.plan==='p1'){const rk=s.rk||'ua',loc=d.reg?.[rk];return loc!=null?Z.p1P(loc,rk):Z.dgP(uah,1.25)}
  return Z.dgP(uah,DG[s.plan]?.k||.30)};
Z._upd=()=>{const p=Z._cp();Z.hideM();Z.showM('Купить — '+fmt(p),()=>Z.buyPS());
  /* Update ZSMART prices on edition change */
  const s=Z.sel,g=Z.ps?.[s.pid];if(!g)return;const eds=g.eds||[['Standard',g.uah]],uah=eds[s.ed]?.[1]||eds[0][1];
  const p2=Z.dgP(uah,.30),p3=Z.dgP(uah,.61);
  document.querySelectorAll('.zsmart .zcard strong').forEach((el,i)=>{el.textContent=fmt(i===0?p3:p2)});
  /* Update P1 prices for selected edition */
  const d=Z.psD?.[s.pid]||{};const p1l=$('p1l');if(p1l){const opts=P1R.map(([rk,fl,rn])=>{const loc=d.reg?.[rk],pr=loc!=null?Z.p1P(loc,rk):rk==='ua'?Z.dgP(uah,1.25):null;return pr?{rk,fl,rn,p:pr}:null}).filter(Boolean);Z._p1Opts=opts;
    p1l.innerHTML=opts.map((o,i)=>`<div class="p1-opt${s.plan==='p1'&&s.rk===o.rk?' on':''}" onclick="Z._pP1(${i},this)"><span class="p1-fl">${o.fl}</span><span class="p1-n">${esc(o.rn)}</span><span class="p1-p">${fmt(o.p)}</span></div>`).join('')}};
Z._pEd=(i,el)=>{Z.sel.ed=i;hap();el.parentElement.querySelectorAll('.zcard').forEach((e,j)=>e.classList.toggle('on',j===i));Z._upd()};
Z._pPl=(k,el)=>{Z.sel.plan=k;hap();el.closest('.zsmart').querySelectorAll('.zcard').forEach(e=>e.classList.remove('on'));el.classList.add('on');
  document.querySelectorAll('#p1l .p1-opt').forEach(e=>e.classList.remove('on'));Z._upd()};
Z._pP1=(ri,el)=>{const opts=Z._p1Opts;Z.sel.plan='p1';Z.sel.rk=opts?.[ri]?.rk||'ua';Z.sel.reg=ri;hap();document.querySelectorAll('.zsmart .zcard').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('#p1l .p1-opt').forEach((e,j)=>e.classList.toggle('on',j===ri));Z._upd()};

Z.rProdST=id=>{const el=$('s-product'),g=Z.steam?.[id];if(!g){el.innerHTML='<div class="empty"><b>🔍</b>Не найдено</div>';return}
  el.innerHTML=`<div>${g.wide||g.header?`<img class="pd-hero" onerror="this.style.display='none'" src="${g.wide||g.header}">`:''}
    <div class="pad"><div class="pd-t">${esc(g.name)}</div><div class="pd-meta"><span>Steam</span>${g.genres?`<span>· ${g.genres.join(', ')}</span>`:''}${g.mc?`<span style="color:var(--ok);font-weight:700">MC ${g.mc}</span>`:''}</div>
      ${g.short?`<div class="pd-desc">${esc(g.short)}</div>`:''}</div>
    ${(g.shots||[]).length?`<div class="shots">${g.shots.slice(0,6).map(s=>`<img src="${s}" loading="lazy" onerror="this.style.display='none'">`).join('')}</div>${g.shots.length>1?`<div style="text-align:center;font-size:.72rem;color:var(--text-3);padding:2px 0">${Math.min(g.shots.length,6)} скриншотов · листайте →</div>`:''}`:''}
    <div class="pad"><button class="btn btn-primary" onclick="Z.openS('/steam#${id}')">Купить · ${fmt(g.price)}</button></div></div>`;
  Z.showM('Купить — '+fmt(g.price),()=>Z.openS('/steam#'+id))};

Z.rProdXB=id=>{const el=$('s-product'),g=Z.xbox?.games?.find(x=>x.id===id);if(!g){el.innerHTML='<div class="empty"><b>🔍</b>Не найдено</div>';return}
  const mp=Math.min(...g.vars.map(v=>v.price));
  el.innerHTML=`<div>${g.hero?`<img class="pd-hero" onerror="this.style.display='none'" src="${g.hero}">`:''}
    <div class="pad"><div class="pd-t">${esc(g.n)}</div><div class="pd-meta"><span>Xbox</span></div>
      ${g.vars.map((v,i)=>`<div class="zcard${i===0?' on':''}" onclick="this.parentElement.querySelectorAll('.zcard').forEach(x=>x.classList.remove('on'));this.classList.add('on')"><div><b>${esc(v.edn)}</b></div><strong>${fmt(v.price)}</strong></div>`).join('')}
      <button class="btn btn-primary" style="margin-top:12px" onclick="Z.openS('/xbox')">Купить · от ${fmt(mp)}</button></div></div>`};

/* ═══ Search ═══ */
Z.rSearch=()=>{$('s-search').innerHTML=`<div class="sbar"><input class="sinput" type="search" placeholder="Найти игру, подписку…" oninput="Z._doS(this.value)" autofocus></div><div id="sR" class="pad"><div class="empty"><b>🔍</b>Введите название</div></div>`};
let _st;Z._doS=q=>{clearTimeout(_st);_st=setTimeout(()=>Z._exS(q),200)};
Z._exS=q=>{const o=$('sR');if(!o)return;q=q.trim().toLowerCase();if(q.length<2){o.innerHTML='<div class="empty"><b>🔍</b>Введите название</div>';return}
  let r=[];if(Z.ps)for(const[id,g]of Object.entries(Z.ps)){if(g.n.toLowerCase().includes(q))r.push({t:'ps',id,n:g.n,p:Z.dgP(g.uah,.30),img:Z.psD?.[id]?.edimg?.['0']||Z.psD?.[id]?.hero||'',pl:'PS Store'})}
  if(Z.si)for(const it of Z.si){if(it[2].toLowerCase().includes(q))r.push({t:it[0]==='s'?'st':'xb',id:String(it[1]),n:it[2],p:it[3],img:it[4]||'',pl:it[0]==='s'?'Steam':'Xbox'})}
  for(const s of SUBS)if(s.n.toLowerCase().includes(q))r.push({t:'sub',n:s.n,p:s.from,img:CDN+s.img,pl:'AI',u:s.u});
  if(!r.length){o.innerHTML='<div class="empty"><b>😔</b>Ничего не найдено</div>';return}
  o.innerHTML=r.slice(0,25).map(x=>`<div class="li" onclick="${x.t==='sub'?`Z.openS('${x.u}')`:`Z.go('product',{t:'${x.t}',id:'${x.id}'})`}">
    ${x.img?`<img class="li-ico" src="${x.img}" loading="lazy" onerror="this.style.display='none'">`:'<div class="li-ico"></div>'}<div class="li-info"><div class="li-n">${esc(x.n)}</div><div class="li-d" style="color:var(--accent);font-weight:600;font-size:.7rem;margin-top:2px">${x.pl}</div></div><div class="li-p">${fmt(x.p)}</div></div>`).join('')};

/* ═══ Favs ═══ */
Z.rFavs=()=>{const el=$('s-favs');if(!Z.favs.size){el.innerHTML=`<div class="empty" style="padding:60px 20px">
  <div style="font-size:3rem;margin-bottom:8px">❤️</div>
  <b style="font-size:1rem">Пока пусто</b>
  <p style="color:var(--text-2);margin-top:6px;font-size:.85rem">
    Нажмите ❤️ на любой игре,<br>чтобы добавить в избранное
  </p>
  <button class="btn btn-primary" style="margin-top:16px;max-width:200px;margin-left:auto;margin-right:auto" onclick="Z.go('ps')">
    Открыть каталог
  </button>
</div>`;return}
  let c='';for(const k of Z.favs){const[t,id]=k.split('_');if(t==='ps'&&Z.ps?.[id])c+=Z.psC(id,Z.ps[id]);else if(t==='st'&&Z.steam?.[id])c+=Z.stC(id,Z.steam[id])}
  el.innerHTML=`<div class="hdr"><button class="hdr-back" onclick="Z.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button><div class="hdr-t">Избранное</div><div class="hdr-cnt">${Z.favs.size}</div></div><div class="pad"><div class="ggrid">${c||'Загрузите каталоги'}</div></div>`};

/* ═══ Actions ═══ */
Z.buyPS=()=>{hap('medium');const s=Z.sel;let pc=s.plan;
  if(pc==='p1'){const rkMap={ua:'u',tr:'t',in:'i',pl:'p',us:'s'};pc='p1'+(rkMap[s.rk]||'u')}
  Z.openL(Z.zmn(s.pid,pc,s.ed,s.cons.toLowerCase()))};
Z.openS=p=>Z.openL(CDN+p);
Z.openL=u=>{tg?.openLink?tg.openLink(u):open(u,'_blank')};
Z.openBot=s=>{if(tg){tg.openTelegramLink(`https://t.me/${BOT}?start=${s||'catalog'}`);tg.close()}else open(`https://t.me/${BOT}?start=${s||'catalog'}`)};

document.addEventListener('DOMContentLoaded',()=>Z.init());
</script>
</body>
</html>
