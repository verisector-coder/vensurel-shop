<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZAMON</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ═══════════════════════════════════════════
   ZAMON Mini App v2 — Premium Telegram Store
   ═══════════════════════════════════════════ */

/* ── Theme ── */
:root {
  --bg:#fbfbfd;--bg2:#f5f5f7;--surface:#fff;--card:#fff;
  --text:#1d1d1f;--text2:#6e6e73;--text3:#86868b;
  --accent:#0878d1;--ok:#1aa251;--sale:#e11d48;--warn:#bf6800;
  --border:rgba(0,0,0,.08);--border2:rgba(0,0,0,.05);
  --shadow:0 4px 20px rgba(0,0,0,.07);--shadow-lg:0 16px 48px rgba(0,0,0,.12);
  --r:16px;--r-lg:24px;--r-full:980px;
  --ease:cubic-bezier(.2,.7,.2,1);
  --tab-h:56px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
[data-theme="dark"]{
  --bg:#000;--bg2:#0b0b0d;--surface:#161617;--card:#1c1c1e;
  --text:#f5f5f7;--text2:#a1a1a6;--text3:#69696e;
  --accent:#3d9cff;--ok:#30d158;--sale:#ff6b8a;--warn:#ffc93c;
  --border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.06);
  --shadow:0 4px 20px rgba(0,0,0,.3);--shadow-lg:0 16px 48px rgba(0,0,0,.5);
}

/* ── Reset ── */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Helvetica Neue",Arial,sans-serif;
  line-height:1.5;letter-spacing:-.011em;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tab-h) + var(--safe-b) + 12px);
  transition:background .3s,color .3s;
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input,select{font:inherit;border:none;background:none;color:inherit}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{display:none}

/* ── Screens ── */
.screen{display:none;min-height:100vh;opacity:0;transition:opacity .2s var(--ease)}
.screen.active{display:block;opacity:1}

/* ── Tab Bar ── */
#tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  display:flex;height:calc(var(--tab-h) + var(--safe-b));padding-bottom:var(--safe-b);
  background:var(--surface);border-top:.5px solid var(--border);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  color:var(--text3);font-size:.6rem;font-weight:600;cursor:pointer;transition:color .15s;
  position:relative;padding:6px 0;-webkit-tap-highlight-color:transparent;
}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px;transition:transform .15s var(--ease)}
.tab:active svg{transform:scale(.85)}
.tab .badge{
  position:absolute;top:2px;right:calc(50% - 18px);
  min-width:16px;height:16px;border-radius:8px;
  background:var(--sale);color:#fff;font-size:.56rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* ── Header ── */
.hdr{
  display:flex;align-items:center;gap:10px;padding:10px 16px;
  position:sticky;top:0;z-index:50;
  background:var(--bg);border-bottom:.5px solid var(--border2);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
}
.hdr-title{font-size:1.05rem;font-weight:700;flex:1}
.hdr-sub{font-size:.78rem;color:var(--text2);font-weight:500}
.hdr-btn{width:34px;height:34px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;cursor:pointer}
.hdr-btn svg{width:16px;height:16px;stroke:var(--text2);fill:none;stroke-width:2}

/* ── Hero ── */
.hero{
  background:radial-gradient(130% 130% at 50% -10%,#1d1d29,#06060a 65%);
  color:#f5f5f7;padding:28px 20px 24px;position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;top:0;right:-30%;width:60%;height:100%;background:radial-gradient(circle,rgba(61,156,255,.08) 0%,transparent 70%);pointer-events:none}
.hero-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.hero-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(145deg,#3a3c42,#0e0f12);
  display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.hero-mark svg{width:20px;height:20px}
.hero-name{font-size:1.15rem;font-weight:800;letter-spacing:-.03em}
.hero h1{font-size:clamp(1.4rem,5vw,1.8rem);font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-bottom:6px}
.hero p{color:rgba(245,245,247,.65);font-size:.86rem;max-width:320px;line-height:1.4}
.hero-stats{display:flex;gap:16px;margin-top:14px}
.hero-stat{text-align:center}
.hero-stat b{display:block;font-size:1.2rem;font-weight:800}
.hero-stat small{font-size:.66rem;color:rgba(245,245,247,.5)}
.hero-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hero-tag{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:var(--r-full);padding:5px 11px;font-size:.72rem;font-weight:600}

/* ── Section ── */
.sec{padding:16px}
.sec-t{font-size:1.05rem;font-weight:800;letter-spacing:-.015em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.sec-t .more{margin-left:auto;font-size:.78rem;font-weight:600;color:var(--accent);cursor:pointer}

/* ── Platform Grid ── */
.plat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.plat-card{
  background:var(--card);border:1px solid var(--border2);border-radius:var(--r);
  padding:14px;display:flex;align-items:center;gap:10px;
  cursor:pointer;transition:transform .12s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.plat-card:active{transform:scale(.96)}
.plat-ico{
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  color:#fff;font-size:1.1rem;flex-shrink:0;
  position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.18),inset 0 1px 1px rgba(255,255,255,.25);
}
.plat-ico.ps{background:linear-gradient(150deg,#2f8cff,#0048a8)}
.plat-ico.steam{background:linear-gradient(150deg,#2b5f9e,#0f1e33)}
.plat-ico.xbox{background:linear-gradient(150deg,#3ec53d,#0a6a0a)}
.plat-ico.subs{background:linear-gradient(150deg,#a071ff,#5b21b6)}
.plat-ico.gift{background:linear-gradient(150deg,#ff6b3d,#c8102e)}
.plat-ico.bliz{background:linear-gradient(150deg,#00aeff,#005baa)}
.plat-name{font-size:.86rem;font-weight:700}
.plat-sub{font-size:.68rem;color:var(--text2);margin-top:1px}

/* ── Game Card ── */
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gc{
  background:var(--card);border:1px solid var(--border2);border-radius:14px;
  overflow:hidden;cursor:pointer;transition:transform .12s var(--ease);
  -webkit-tap-highlight-color:transparent;
}
.gc:active{transform:scale(.97)}
.gc-img{aspect-ratio:3/4;background:var(--bg2);position:relative;overflow:hidden}
.gc-img img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.gc-img img.ld{opacity:1}
.gc-img.no-img{display:grid;place-items:center;font-size:2.5rem;color:var(--text3)}
.gc-badge{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:6px;font-size:.62rem;font-weight:800;letter-spacing:.02em}
.gc-sale{background:var(--sale);color:#fff}
.gc-pre{background:var(--warn);color:#fff}
.gc-plus{position:absolute;top:6px;right:6px;background:rgba(255,215,0,.92);color:#1a1200;font-size:.58rem;font-weight:800;padding:2px 6px;border-radius:5px}
.gc-fav{
  position:absolute;bottom:6px;right:6px;width:30px;height:30px;border-radius:50%;
  background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:grid;place-items:center;cursor:pointer;
  transition:transform .15s var(--ease);
}
.gc-fav:active{transform:scale(.8)}
.gc-fav svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.2}
.gc-fav.on svg{fill:#ff375f;stroke:#ff375f}
.gc-body{padding:8px 10px 10px}
.gc-name{font-size:.78rem;font-weight:600;line-height:1.2;margin-bottom:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gc-price{font-size:.84rem;font-weight:700}
.gc-old{font-size:.72rem;color:var(--text3);text-decoration:line-through;margin-right:3px}
.gc-from{font-size:.64rem;color:var(--text2);font-weight:500}
.gc-deal-end{font-size:.6rem;color:var(--sale);font-weight:600;margin-top:2px}

/* ── Horizontal Shelf ── */
.shelf{display:flex;gap:8px;overflow-x:auto;padding:0 16px 4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.shelf .gc{flex:0 0 145px;scroll-snap-align:start}

/* ── Product Detail ── */
.pd{padding-bottom:90px}
.pd-hero{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--bg2)}
.pd-body{padding:16px}
.pd-title{font-size:1.25rem;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-bottom:2px}
.pd-meta{color:var(--text2);font-size:.78rem;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pd-tag{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:.66rem;font-weight:700}
.pd-tag-ok{background:rgba(26,162,81,.1);color:var(--ok)}
.pd-tag-sale{background:rgba(225,29,72,.08);color:var(--sale)}
.pd-tag-mc{background:rgba(102,187,106,.12);color:#2e7d32}
.pd-desc{color:var(--text2);font-size:.84rem;line-height:1.5;margin-bottom:16px}

/* Edition picker */
.ed-list{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.ed{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;
  border:2px solid var(--border);background:var(--surface);cursor:pointer;transition:.15s;
}
.ed.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ed-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--text3);display:grid;place-items:center;flex-shrink:0;transition:.15s}
.ed.on .ed-dot{border-color:var(--accent)}
.ed.on .ed-dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent)}
.ed-n{flex:1;font-size:.84rem;font-weight:600}
.ed-p{font-weight:700;font-size:.86rem;white-space:nowrap}
.ed-p-old{font-size:.72rem;color:var(--text3);text-decoration:line-through;margin-right:3px}

/* Plan picker */
.plan-row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.plan{
  text-align:center;padding:10px 4px 8px;border-radius:12px;
  border:2px solid var(--border);background:var(--surface);cursor:pointer;transition:.15s;
}
.plan.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.plan b{display:block;font-size:.84rem}
.plan small{display:block;font-size:.62rem;color:var(--text2);line-height:1.25;margin:2px 0 4px;min-height:2.5em}
.plan .plan-p{font-size:.82rem;font-weight:700}

/* Screenshots */
.shots{display:flex;gap:6px;overflow-x:auto;padding:0 16px 14px;scroll-snap-type:x mandatory}
.shots img{height:160px;border-radius:10px;scroll-snap-align:start;flex-shrink:0}

/* Why play */
.why{padding:10px 12px;background:var(--bg2);border-radius:12px;margin-bottom:6px}
.why b{display:block;font-size:.82rem;margin-bottom:1px}
.why p{font-size:.76rem;color:var(--text2);line-height:1.35}

/* ── Search ── */
.s-bar{position:sticky;top:0;z-index:50;padding:8px 16px;background:var(--bg);border-bottom:.5px solid var(--border2);backdrop-filter:saturate(180%) blur(20px)}
.s-input{
  width:100%;padding:9px 12px 9px 36px;border-radius:12px;
  background:var(--bg2);border:1.5px solid transparent;
  font-size:.88rem;color:var(--text);transition:border-color .15s;
}
.s-input:focus{outline:none;border-color:var(--accent)}
.s-input::placeholder{color:var(--text3)}
.s-ico{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text3)}

/* ── Sub Card (AI, Search Results) ── */
.sc{
  display:flex;align-items:center;gap:12px;padding:11px 14px;
  background:var(--card);border:1px solid var(--border2);border-radius:14px;
  margin-bottom:6px;cursor:pointer;transition:transform .12s var(--ease);
}
.sc:active{transform:scale(.98)}
.sc-ico{width:44px;height:44px;border-radius:12px;flex-shrink:0;object-fit:cover;background:var(--bg2)}
.sc-info{flex:1;min-width:0}
.sc-name{font-size:.86rem;font-weight:700}
.sc-desc{font-size:.72rem;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-price{font-weight:700;font-size:.84rem;text-align:right;white-space:nowrap}
.sc-from{font-size:.62rem;color:var(--text2);font-weight:500}

/* ── Filters ── */
.filters{display:flex;gap:5px;overflow-x:auto;padding:4px 16px 10px}
.chip{
  padding:6px 12px;border-radius:var(--r-full);border:1.5px solid var(--border);
  background:var(--surface);font-size:.76rem;font-weight:600;white-space:nowrap;
  cursor:pointer;transition:.12s;flex-shrink:0;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:active{transform:scale(.94)}

/* ── Reviews ── */
.rv{background:var(--card);border:1px solid var(--border2);border-radius:14px;padding:11px 13px;margin-bottom:6px}
.rv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.rv-stars{color:#ffb400;font-size:.8rem;letter-spacing:.5px}
.rv-game{font-size:.66rem;color:var(--text2);background:var(--bg2);border-radius:var(--r-full);padding:1px 7px}
.rv-text{font-size:.82rem;line-height:1.4}
.rv-meta{font-size:.66rem;color:var(--ok);font-weight:600;margin-top:3px}
.rv-banner{
  display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:10px;
  border-radius:14px;background:linear-gradient(135deg,#1b8f4a,#25b866);color:#fff;
}
.rv-big{font-size:2rem;font-weight:800;line-height:1}
.rv-big-stars{color:#ffd60a;font-size:.8rem}
.rv-big-cnt{font-size:.72rem;opacity:.85}

/* ── Buttons ── */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:14px 24px;border-radius:var(--r-full);font-weight:700;font-size:.95rem;
  cursor:pointer;transition:.15s var(--ease);
}
.btn:active{transform:scale(.97)}
.btn-primary{
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 90%,#fff),var(--accent));
  color:#fff;box-shadow:0 4px 16px color-mix(in srgb,var(--accent) 40%,transparent);
}
.btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--border)}

/* ── Misc ── */
.loading{display:flex;align-items:center;justify-content:center;padding:60px 20px;color:var(--text2);gap:10px}
.spinner{width:20px;height:20px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:60px 20px;color:var(--text2)}
.empty-ico{font-size:2.5rem;margin-bottom:8px}
.empty-msg{font-size:.88rem;font-weight:600}
.empty-sub{font-size:.78rem;color:var(--text3);margin-top:4px}
.cnt{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.cnt-btn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font-size:1.1rem;font-weight:700;cursor:pointer}
.cnt-btn:active{background:var(--bg2)}
.cnt-val{font-size:1.2rem;font-weight:800;min-width:24px;text-align:center}
.divider{height:1px;background:var(--border);margin:0 16px}
.toast{
  position:fixed;bottom:calc(var(--tab-h) + var(--safe-b) + 16px);left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--text);color:var(--bg);padding:10px 20px;border-radius:var(--r-full);
  font-weight:600;font-size:.84rem;z-index:300;opacity:0;transition:.35s var(--ease);
  box-shadow:var(--shadow-lg);white-space:nowrap;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.cur-label{font-size:.72rem;font-weight:700;color:var(--accent);cursor:pointer;padding:4px 8px;border-radius:8px;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.home-add{
  margin:12px 16px;padding:12px 16px;border-radius:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 12%,transparent),color-mix(in srgb,var(--accent) 4%,transparent));
  border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
  display:flex;align-items:center;gap:10px;cursor:pointer;
}
.home-add-ico{font-size:1.5rem}
.home-add b{font-size:.82rem}
.home-add small{font-size:.7rem;color:var(--text2);display:block}
</style>
</head>
<body>

<div id="app">
  <div id="s-home" class="screen active"></div>
  <div id="s-ps" class="screen"></div>
  <div id="s-steam" class="screen"></div>
  <div id="s-xbox" class="screen"></div>
  <div id="s-subs" class="screen"></div>
  <div id="s-gifts" class="screen"></div>
  <div id="s-reviews" class="screen"></div>
  <div id="s-product" class="screen"></div>
  <div id="s-search" class="screen"></div>
  <div id="s-favs" class="screen"></div>
</div>

<nav id="tabbar">
  <button class="tab on" data-t="home" onclick="Z.tab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
    <span>Главная</span>
  </button>
  <button class="tab" data-t="catalog" onclick="Z.tab('catalog')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>Каталог</span>
  </button>
  <button class="tab" data-t="search" onclick="Z.tab('search')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <span>Поиск</span>
  </button>
  <button class="tab" data-t="favs" onclick="Z.tab('favs')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>
    <span>Избранное</span>
    <span id="favBadge" class="badge" style="display:none"></span>
  </button>
</nav>
<div id="toast" class="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   ZAMON Mini App v2 — Premium Telegram Store
   ═══════════════════════════════════════════════ */
const tg=window.Telegram?.WebApp;
const CDN='https://zamon.app';
const BOT='TarkonGameBot';

/* ── Catalogs Config ── */
const PLANS={
  p2:{l:'П2',d:'Общий аккаунт\nонлайн',f:1},
  p1:{l:'П1',d:'На ваш аккаунт\nнавсегда',f:1.8},
  p3:{l:'П3',d:'Общий аккаунт\nонлайн+офлайн',f:1.25},
};
const MODES={S:'Одиночная',SO:'Одиночная / Сеть',SCL:'Кооп (лок.)',OC:'Кооп (сеть)'};

  {id:'chatgpt',n:'ChatGPT',d:'Go · Plus · Pro',img:'/img/subs/chatgpt.png',u:'/podpiska-chatgpt',from:669},

const Z={
  scr:'home',hist:[],favs:new Set(),cur:'RUB',rate:2.45,usdRate:92,
  ps:null,psD:null,psDeals:null,
  steam:null,shelves:null,

};

/* ═══ INIT ═══ */
Z.init=function(){
  if(tg){
    tg.ready(); tg.expand();
    try{tg.disableVerticalSwipes?.()}catch(e){}
    try{tg.requestFullscreen?.()}catch(e){}

    const dark=tg.colorScheme==='dark';
    document.documentElement.dataset.theme=dark?'dark':'light';
    tg.onEvent('themeChanged',()=>{
      document.documentElement.dataset.theme=tg.colorScheme==='dark'?'dark':'light';
      Z.syncUI();
    });
    Z.syncUI();
    tg.BackButton.onClick(()=>Z.back());

    // CloudStorage favs
    if(tg.CloudStorage){
      tg.CloudStorage.getItem('zfavs',(e,v)=>{
        if(v)try{Z.favs=new Set(JSON.parse(v))}catch(x){}
        Z.updFavBadge();
      });
    }else{
      try{Z.favs=new Set(JSON.parse(localStorage.getItem('zfavs')||'[]'))}catch(x){}
    }
  }else{
    document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  }

  Z.renderHome();
  Z.loadPS();
  Z.loadSearch();
  Z.updFavBadge();
};

Z.syncUI=function(){
  if(!tg)return;
  const d=tg.colorScheme==='dark';
  try{
    tg.setHeaderColor(d?'#000000':'#fbfbfd');
    tg.setBackgroundColor(d?'#000000':'#fbfbfd');
    tg.setBottomBarColor?.(d?'#161617':'#ffffff');
  }catch(e){}
};

/* ═══ NAV ═══ */
Z.go=function(s,p){Z.hist.push({s:Z.scr,y:scrollY});Z._show(s,p)};
Z._show=function(s,p){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
  Z.scr=s;
  const el=$('s-'+s);if(el)el.classList.add('active');
  const R={home:Z.renderHome,ps:Z.renderPS,steam:Z.renderSteam,xbox:Z.renderXbox,
    subs:Z.renderSubs,gifts:Z.renderGifts,reviews:Z.renderReviews,
    product:()=>Z.renderProduct(p),search:Z.renderSearch,favs:Z.renderFavs};
  R[s]?.();scrollTo(0,0);
  tg?.BackButton?.[Z.hist.length?'show':'hide']();
  Z.hideMain();Z.haptic('light');
};
Z.back=function(){if(!Z.hist.length)return;const p=Z.hist.pop();Z._show(p.s);setTimeout(()=>scrollTo(0,p.y),30)};
Z.tab=function(t){
  const m={home:'home',catalog:'ps',search:'search',favs:'favs'};
  Z.hist=[];Z._show(m[t]||t);
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  tg?.BackButton?.hide();
};

/* ═══ UTILS ═══ */
function $(id){return document.getElementById(id)}
Z.haptic=function(s){tg?.HapticFeedback?.impactOccurred(s||'light')};
Z.toast=function(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
Z.esc=function(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML};
Z.fmtP=function(p){return Math.round(p).toLocaleString('ru-RU')+' ₽'};
Z.psP=function(uah){return Math.ceil(uah*Z.rate/10)*10-1};
Z.showMain=function(txt,cb){if(!tg?.MainButton)return;tg.MainButton.setText(txt);tg.MainButton.show();tg.MainButton.onClick(cb);Z._mainCb=cb};
Z.hideMain=function(){if(!tg?.MainButton)return;tg.MainButton.hide();if(Z._mainCb){tg.MainButton.offClick(Z._mainCb);Z._mainCb=null}};

/* ── Favs ── */
Z.toggleFav=function(k,ev){
  if(ev){ev.stopPropagation();ev.preventDefault()}
  const had=Z.favs.has(k);
  if(had)Z.favs.delete(k);else Z.favs.add(k);
  Z.saveFavs();Z.updFavBadge();Z.haptic('medium');
  Z.toast(had?'Убрано из избранного':'❤️ Добавлено в избранное');
  // Update button visually
  document.querySelectorAll(`[data-fav="${k}"]`).forEach(b=>b.classList.toggle('on',!had));
};
Z.saveFavs=function(){
  const j=JSON.stringify([...Z.favs]);
  tg?.CloudStorage?tg.CloudStorage.setItem('zfavs',j):localStorage.setItem('zfavs',j);
};
Z.updFavBadge=function(){
  const b=$('favBadge');if(!b)return;
  if(Z.favs.size){b.textContent=Z.favs.size;b.style.display=''}else b.style.display='none';
};
Z.isFav=function(k){return Z.favs.has(k)};

/* ═══ DATA ═══ */
Z.fetchJ=async function(u){const r=await fetch(u);if(!r.ok)throw r.status;return r.json()};
Z.loadScript=function(u){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)})};

Z.loadPS=async function(){
  if(Z.ps)return;
  try{
    const[c,d]=await Promise.all([Z.fetchJ(CDN+'/ru-catalog.json'),Z.fetchJ(CDN+'/ps-plus-deals.json').catch(()=>null)]);
    Z.ps=c.games||c;Z.psDeals=d;
    // Background: full game data
    Z.fetchJ(CDN+'/games-data.json').then(x=>{Z.psD=x;Z.renderHome()}).catch(()=>{});
  }catch(e){console.warn('PS:',e);Z.ps={}}
};
Z.loadSteam=async function(){
  if(Z.steam)return;
  try{await Z.loadScript(CDN+'/steam-catalog.js');Z.steam=window.CATALOG||{};Z.shelves=window.SHELVES||{}}
  catch(e){console.warn('Steam:',e);Z.steam={}}
};
Z.loadXbox=async function(){
  if(Z.xbox)return;
  try{await Z.loadScript(CDN+'/xbox-catalog.js');Z.xbox=window.XBOX||{}}
  catch(e){console.warn('Xbox:',e);Z.xbox={}}
};
Z.loadSearch=async function(){
  if(Z.searchIdx)return;
  try{const d=await Z.fetchJ(CDN+'/search-index.json');Z.searchIdx=d.items||[]}catch(e){Z.searchIdx=[]}
};
Z.loadReviews=async function(){
  if(Z.reviews)return;
  try{Z.reviews=await Z.fetchJ(CDN+'/reviews.json')}catch(e){Z.reviews=null}
};

/* ═══ CARD BUILDERS ═══ */
Z.favBtn=function(k){
  return `<button class="gc-fav${Z.isFav(k)?' on':''}" data-fav="${k}" onclick="Z.toggleFav('${k}',event)">
    <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg></button>`;
};

Z.dealTimer=function(end){
  const ms=end*1000-Date.now();if(ms<=0)return'';
  const h=Math.floor(ms/36e5),d=Math.floor(h/24);
  if(d>3)return`${d} дн`;if(d>=1)return`${d}д ${h%24}ч`;return`${h}ч`;
};

Z.psCard=function(id,g){
  const p=Z.psP(g.uah);
  const deal=g.deal&&g.deal.end*1000>Date.now();
  const dp=deal?Z.psP(g.deal.disc):null;
  const pct=deal?Math.round((1-g.deal.disc/g.deal.full)*100):0;
  const img=Z.psD?.[id]?.edimg?.['0']||Z.psD?.[id]?.hero||Z.psD?.[id]?.shots?.[0]||'';
  const timer=deal?Z.dealTimer(g.deal.end):'';
  return `<div class="gc" onclick="Z.go('product',{t:'ps',id:'${id}'})">
    <div class="gc-img${img?'':' no-img'}">
      ${img?`<img src="${img}" alt="" loading="lazy" onload="this.classList.add('ld')">`:'🎮'}
      ${deal?`<span class="gc-badge gc-sale">-${pct}%</span>`:''}
      ${g.pre?'<span class="gc-badge gc-pre">Предзаказ</span>':''}
      ${g.plus?'<span class="gc-plus">PS+</span>':''}
      ${Z.favBtn('ps_'+id)}
    </div>
    <div class="gc-body">
      <div class="gc-name">${Z.esc(g.n)}</div>
      <div class="gc-price">
        ${deal?`<span class="gc-old">${Z.fmtP(p)}</span>`:''}<span class="gc-from">от </span>${Z.fmtP(dp||p)}
      </div>
      ${timer?`<div class="gc-deal-end">⏱ ${timer}</div>`:''}
    </div>
  </div>`;
};

Z.stCard=function(id,g){
  return `<div class="gc" onclick="Z.go('product',{t:'steam',id:'${id}'})">
    <div class="gc-img"><img src="${g.cap||g.header}" alt="" loading="lazy" onload="this.classList.add('ld')">
      ${g.steam_disc>0?`<span class="gc-badge gc-sale">-${g.steam_disc}%</span>`:''}
      ${Z.favBtn('st_'+id)}
    </div>
    <div class="gc-body">
      <div class="gc-name">${Z.esc(g.name)}</div>
      <div class="gc-price">${Z.fmtP(g.price)}</div>
    </div>
  </div>`;
};

Z.xbCard=function(g){
  const mp=Math.min(...g.vars.map(v=>v.price));
  const img=g.cover||g.hero||g.img||'';
  return `<div class="gc" onclick="Z.go('product',{t:'xbox',id:'${g.id}'})">
    <div class="gc-img${img?'':' no-img'}">${img?`<img src="${img}" alt="" loading="lazy" onload="this.classList.add('ld')">`:'🎮'}${Z.favBtn('xb_'+g.id)}</div>
    <div class="gc-body"><div class="gc-name">${Z.esc(g.n)}</div><div class="gc-price"><span class="gc-from">от </span>${Z.fmtP(mp)}</div></div>
  </div>`;
};

Z._homeAdd=function(){
  if(!tg?.addToHomeScreen)return'';
  return`<div class="home-add" onclick="tg.addToHomeScreen();Z.haptic('medium')">
    <span class="home-add-ico">📲</span>
    <div><b>Добавить на главный экран</b><small>Открывайте магазин в один клик</small></div>
  </div>`;
};

Z._homeDeals=function(){
  if(!Z.ps||!Z.psDeals?.deals?.length)return'';
  const now=Date.now();
  const act=Z.psDeals.deals.filter(d=>!d.gated&&d.end*1000>now).slice(0,12);
  if(!act.length)return'';
  let c='';
  for(const d of act){const g=Z.ps[d.id];if(g)c+=Z.psCard(d.id,g)}
  if(!c)return'';
  return`<div class="sec"><div class="sec-t">🔥 Скидки PS Store <span class="more" onclick="Z.go('ps');Z.filter.ps='deals'">Все →</span></div></div><div class="shelf">${c}</div>`;
};

Z._homeHits=function(){
  if(!Z.ps)return'';
  const ids=Object.keys(Z.ps).slice(0,12);
  return`<div class="sec"><div class="sec-t">🏆 Популярное <span class="more" onclick="Z.go('ps')">Все →</span></div></div><div class="shelf">${ids.map(id=>Z.psCard(id,Z.ps[id])).join('')}</div>`;
};

Z._homeSubs=function(){
  return`<div class="sec"><div class="sec-t">🤖 AI и подписки <span class="more" onclick="Z.go('subs')">Все →</span></div>
    ${SUBS.slice(0,4).map(s=>`<div class="sc" onclick="Z.openSite('${s.u}')">
      <img class="sc-ico" src="${CDN}${s.img}" alt="" loading="lazy">
      <div class="sc-info"><div class="sc-name">${Z.esc(s.n)}</div><div class="sc-desc">${Z.esc(s.d)}</div></div>
      <div class="sc-price"><div class="sc-from">от</div>${Z.fmtP(s.from)}</div>
    </div>`).join('')}
  </div>`;
};

/* ── PS CATALOG ── */
Z.renderPS=function(){
  const el=$('s-ps');
  if(!Z.ps||!Object.keys(Z.ps).length){el.innerHTML='<div class="loading"><div class="spinner"></div>Загружаем каталог</div>';Z.loadPS().then(()=>Z.renderPS());return}
  let games=Object.entries(Z.ps);const f=Z.filter.ps,now=Date.now();
  if(f==='deals')games=games.filter(([,g])=>g.deal&&g.deal.end*1000>now);
  else if(f==='ps4')games=games.filter(([,g])=>g.ps4);
  else if(f==='pre')games=games.filter(([,g])=>g.pre);
  if(Z.sort.ps==='cheap')games.sort((a,b)=>a[1].uah-b[1].uah);
  else if(Z.sort.ps==='expensive')games.sort((a,b)=>b[1].uah-a[1].uah);

  el.innerHTML=`
    <div class="hdr"><div class="hdr-title">PlayStation</div><div class="hdr-sub">${games.length} игр</div>
      <div class="hdr-btn" onclick="Z._psSort()"><svg viewBox="0 0 24 24"><path d="M3 6h18M6 12h12M9 18h6"/></svg></div>
    </div>
    <div class="filters">
      ${['all:Все','deals:🔥 Скидки','pre:🆕 Предзаказы','ps4:PS4'].map(x=>{const[k,l]=x.split(':');return`<button class="chip${f===k?' on':''}" onclick="Z.filter.ps='${k}';Z.renderPS()">${l}</button>`}).join('')}
    </div>
    <div class="sec" style="padding-top:0"><div class="game-grid">${games.map(([id,g])=>Z.psCard(id,g)).join('')}</div></div>`;
};

Z._psSort=function(){
  const s=Z.sort.ps;
  Z.sort.ps=s==='default'?'cheap':s==='cheap'?'expensive':'default';
  Z.toast(Z.sort.ps==='cheap'?'Сначала дешёвые':Z.sort.ps==='expensive'?'Сначала дорогие':'По умолчанию');
  Z.renderPS();Z.haptic('light');
};

/* ── STEAM CATALOG ── */
Z.renderSteam=async function(){
  const el=$('s-steam');
  if(!Z.steam){el.innerHTML='<div class="loading"><div class="spinner"></div>Загружаем Steam</div>';await Z.loadSteam()}
  if(!Z.steam||!Object.keys(Z.steam).length){el.innerHTML='<div class="empty"><div class="empty-ico">😔</div><div class="empty-msg">Не удалось загрузить</div></div>';return}
  const games=Object.entries(Z.steam);
  let topH='';
  if(Z.shelves?.top?.length){
    topH=`<div class="sec"><div class="sec-t">🔥 Топ Steam</div></div><div class="shelf">${Z.shelves.top.slice(0,12).map(a=>{const g=Z.steam[a];return g?Z.stCard(a,g):''}).join('')}</div>`;
  }
  let saleH='';
  if(Z.shelves?.sale?.length){
    saleH=`<div class="sec"><div class="sec-t">💰 Со скидкой</div></div><div class="shelf">${Z.shelves.sale.slice(0,12).map(a=>{const g=Z.steam[a];return g?Z.stCard(a,g):''}).join('')}</div>`;
  }
  const show=50;
  el.innerHTML=`
    <div class="hdr"><div class="hdr-title">Steam</div><div class="hdr-sub">${games.length} игр</div></div>
    ${topH}${saleH}
    <div class="sec"><div class="sec-t">Все игры</div>
      <div class="game-grid" id="stGrid">${games.slice(0,show).map(([id,g])=>Z.stCard(id,g)).join('')}</div>
      ${games.length>show?`<div style="text-align:center;padding:16px"><button class="btn btn-secondary" style="width:auto;padding:10px 24px" onclick="Z._stAll()">Показать все ${games.length}</button></div>`:''}
    </div>`;
};
Z._stAll=function(){const g=Object.entries(Z.steam);$('stGrid').innerHTML=g.map(([id,g])=>Z.stCard(id,g)).join('');this?.closest?.('.btn')?.parentElement?.remove?.()};

/* ── XBOX CATALOG ── */
Z.renderXbox=async function(){
  const el=$('s-xbox');
  if(!Z.xbox){el.innerHTML='<div class="loading"><div class="spinner"></div>Загружаем Xbox</div>';await Z.loadXbox()}
  if(!Z.xbox?.games?.length){el.innerHTML='<div class="empty"><div class="empty-ico">😔</div><div class="empty-msg">Не удалось загрузить</div></div>';return}
  const main=Z.xbox.games.filter(g=>!g.dlc);
  let gpH='';
  if(Z.xbox.gamepass?.length){
    gpH=`<div class="sec"><div class="sec-t">🎮 Game Pass</div>
      ${Z.xbox.gamepass.map(gp=>`<div class="sc" onclick="Z.openSite('/xbox')">
        <div class="sc-ico" style="background:linear-gradient(150deg,#3ec53d,#0a6a0a);display:grid;place-items:center;color:#fff;font-weight:800;font-size:.75rem;border-radius:12px">${gp.tier.slice(0,3)}</div>
        <div class="sc-info"><div class="sc-name">Game Pass ${Z.esc(gp.tier)}</div><div class="sc-desc">${gp.plans.map(p=>p.m+' мес').join(' · ')}</div></div>
        <div class="sc-price"><div class="sc-from">от</div>${Z.fmtP(Math.round(gp.plans[0].usd*Z.usdRate))}</div>
      </div>`).join('')}</div>`;
  }
  el.innerHTML=`<div class="hdr"><div class="hdr-title">Xbox</div><div class="hdr-sub">${main.length} игр</div></div>${gpH}
    <div class="sec"><div class="sec-t">🎮 Игры</div><div class="game-grid">${main.slice(0,40).map(g=>Z.xbCard(g)).join('')}</div></div>`;
};

/* ── SUBS ── */
Z.renderSubs=function(){
  $('s-subs').innerHTML=`<div class="hdr"><div class="hdr-title">AI-подписки и сервисы</div></div>
    <div class="sec">${SUBS.map(s=>`<div class="sc" onclick="Z.openSite('${s.u}')">
      <img class="sc-ico" src="${CDN}${s.img}" alt="" loading="lazy">
      <div class="sc-info"><div class="sc-name">${Z.esc(s.n)}</div><div class="sc-desc">${Z.esc(s.d)}</div></div>
      <div class="sc-price"><div class="sc-from">от</div>${Z.fmtP(s.from)}</div>
    </div>`).join('')}</div>`;
};

/* ── GIFTS ── */
Z.renderGifts=function(){
  $('s-gifts').innerHTML=`<div class="hdr"><div class="hdr-title">Подарочные карты</div></div>
    <div class="sec"><div class="plat-grid">${GIFTS.map(c=>`<div class="plat-card" onclick="Z.openBot('gifts')">
      <div class="plat-ico gift" style="font-size:1.2rem">${c.e}</div><div><div class="plat-name">${c.n}</div><div class="plat-sub">${c.s}</div></div>
    </div>`).join('')}</div>
    <p style="text-align:center;color:var(--text3);font-size:.76rem;margin-top:14px;padding:0 10px">Нажмите на карту — откроется каталог бота с полным списком номиналов и регионов</p></div>`;
};

/* ── REVIEWS ── */
Z.renderReviews=async function(){
  const el=$('s-reviews');
  if(!Z.reviews){el.innerHTML='<div class="loading"><div class="spinner"></div>Загружаем отзывы</div>';await Z.loadReviews()}
  if(!Z.reviews){el.innerHTML='<div class="empty"><div class="empty-ico">😔</div><div class="empty-msg">Не удалось загрузить отзывы</div></div>';return}
  const r=Z.reviews;
  const totalCount=parseInt(r.count||0)+parseInt(r.avito?.count||0);
  el.innerHTML=`<div class="hdr"><div class="hdr-title">Отзывы</div><div class="hdr-sub">${totalCount.toLocaleString()}</div></div>
    <div class="sec">
      <div class="rv-banner">
        <div><div class="rv-big">${r.rating} ★</div><div class="rv-big-stars">★★★★★</div></div>
        <div style="flex:1"><div style="font-weight:700">${totalCount.toLocaleString()} отзывов</div>
          <div class="rv-big-cnt">FunPay: ${parseInt(r.count).toLocaleString()} · Авито: ${parseInt(r.avito?.count||0).toLocaleString()}</div></div>
      </div>
      <div class="filters">
        <button class="chip on" onclick="Z._rvFilter('all',this)">Все</button>
        <button class="chip" onclick="Z._rvFilter('fp',this)">FunPay</button>
        <button class="chip" onclick="Z._rvFilter('av',this)">Авито</button>
      </div>
      <div id="rvList">
        ${(r.items||[]).map(i=>`<div class="rv"><div class="rv-head"><span class="rv-stars">${'★'.repeat(i.stars)}</span><span class="rv-game">${Z.esc(i.game||'')}</span></div><div class="rv-text">${Z.esc(i.text)}</div><div class="rv-meta">✓ FunPay</div></div>`).join('')}
        ${(r.avito?.items||[]).map(i=>`<div class="rv"><div class="rv-head"><span class="rv-stars">${'★'.repeat(i.stars)}</span><span class="rv-game">${Z.esc(i.name||'')}</span></div><div class="rv-text">${Z.esc(i.text)}</div><div class="rv-meta">✓ Авито · ${i.date||''}</div></div>`).join('')}
      </div>
    </div>`;
};
Z._rvFilter=function(f,btn){
  btn.closest('.filters').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));btn.classList.add('on');
  const r=Z.reviews,el=$('rvList');if(!r||!el)return;
  let html='';
  if(f!=='av')(r.items||[]).forEach(i=>{html+=`<div class="rv"><div class="rv-head"><span class="rv-stars">${'★'.repeat(i.stars)}</span><span class="rv-game">${Z.esc(i.game||'')}</span></div><div class="rv-text">${Z.esc(i.text)}</div><div class="rv-meta">✓ FunPay</div></div>`});
  if(f!=='fp')(r.avito?.items||[]).forEach(i=>{html+=`<div class="rv"><div class="rv-head"><span class="rv-stars">${'★'.repeat(i.stars)}</span><span class="rv-game">${Z.esc(i.name||'')}</span></div><div class="rv-text">${Z.esc(i.text)}</div><div class="rv-meta">✓ Авито · ${i.date||''}</div></div>`});
  el.innerHTML=html;Z.haptic('light');
};

/* ── PRODUCT DETAIL ── */
Z.renderProduct=function(p){if(!p)return;({ps:Z.renderPD_PS,steam:Z.renderPD_ST,xbox:Z.renderPD_XB})[p.t]?.(p.id)};

Z.renderPD_PS=function(id){
  const el=$('s-product'),g=Z.ps?.[id];if(!g){el.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div class="empty-msg">Игра не найдена</div></div>';return}
  const d=Z.psD?.[id]||{};
  const hero=d.hero||d.shots?.[0]||d.edimg?.['0']||'';
  const eds=g.eds||[['Standard',g.uah]];
  const baseP=Z.psP(eds[0][1]);

  const edsH=eds.map((e,i)=>{
    const p=Z.psP(e[1]);const deal=i===0&&g.deal?Z.psP(g.deal.disc):g.deal_eds?.[i]?Z.psP(g.deal_eds[i].disc):null;
    return`<div class="ed${i===0?' on':''}" onclick="Z._pickEd(this,${i},'${id}')"><div class="ed-dot"></div><span class="ed-n">${Z.esc(e[0])}</span><span class="ed-p">${deal?`<span class="ed-p-old">${Z.fmtP(p)}</span>`:''} ${Z.fmtP(deal||p)}</span></div>`;
  }).join('');

  const planH=Object.entries(PLANS).map(([k,v])=>{
    const pp=Math.ceil(baseP*v.f/10)*10-1;
    return`<div class="plan${k==='p2'?' on':''}" onclick="Z._pickPlan(this,'${k}')"><b>${v.l}</b><small>${v.d.replace('\n','<br>')}</small><div class="plan-p">${Z.fmtP(pp)}</div></div>`;
  }).join('');

  el.innerHTML=`<div class="pd">
    ${hero?`<img class="pd-hero" src="${hero}" alt="" loading="lazy">`:''}
    <div class="pd-body">
      <div style="display:flex;gap:10px;align-items:start">
        <div style="flex:1">
          <div class="pd-title">${Z.esc(g.n)}</div>
          <div class="pd-meta">
            <span>${g.ps4?'PS4 / PS5':'PS5'}</span>
            ${d.mode?`<span>· ${MODES[d.mode]||d.mode}</span>`:''}
            ${g.deal?`<span class="pd-tag pd-tag-sale">-${Math.round((1-g.deal.disc/g.deal.full)*100)}%</span>`:''}
            ${g.plus?'<span class="pd-tag pd-tag-ok">PS+</span>':''}
          </div>
        </div>
        <button class="gc-fav${Z.isFav('ps_'+id)?' on':''}" data-fav="ps_${id}" style="position:static;width:38px;height:38px;background:var(--bg2)"
          onclick="Z.toggleFav('ps_${id}',event)">
          <svg viewBox="0 0 24 24" style="stroke:var(--text)"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>
        </button>
      </div>
      ${d.desc?`<div class="pd-desc">${Z.esc(d.desc)}</div>`:''}
    </div>
    ${(d.shots||[]).length?`<div class="shots">${d.shots.slice(0,8).map(s=>`<img src="${s}" alt="" loading="lazy">`).join('')}</div>`:''}
    <div class="pd-body" style="padding-top:2px">
      ${(d.why||[]).length?`<div class="sec-t" style="margin-bottom:8px">🎯 Почему стоит сыграть</div>${d.why.map(w=>`<div class="why"><b>${Z.esc(w[0])}</b><p>${Z.esc(w[1])}</p></div>`).join('')}<div style="height:14px"></div>`:''}
      <div class="sec-t" style="margin-bottom:6px">📦 Издание</div>
      <div class="ed-list">${edsH}</div>
      <div class="sec-t" style="margin-bottom:6px">🔑 Тип активации</div>
      <div class="plan-row">${planH}</div>
      <button class="btn btn-primary" onclick="Z.buyPS('${id}')">🛒 Купить за ${Z.fmtP(baseP)}</button>
    </div>
  </div>`;
  Z.showMain(`🛒 Купить — ${Z.fmtP(baseP)}`,()=>Z.buyPS(id));
};

Z._pickEd=function(el,i,id){el.closest('.ed-list').querySelectorAll('.ed').forEach(e=>e.classList.remove('on'));el.classList.add('on');Z.haptic('light')};
Z._pickPlan=function(el,k){el.closest('.plan-row').querySelectorAll('.plan').forEach(e=>e.classList.remove('on'));el.classList.add('on');Z.haptic('light');
  // Update price on button
  const g=Z.ps?.[Z._curPsId()];if(!g)return;
  const edIdx=[...el.closest('.pd-body').parentElement.querySelectorAll('.ed')].findIndex(e=>e.classList.contains('on'));
  const eds=g.eds||[['Standard',g.uah]];const uah=eds[edIdx>=0?edIdx:0][1];
  const p=Math.ceil(Z.psP(uah)*PLANS[k].f/10)*10-1;
  el.closest('.pd-body').querySelector('.btn-primary').textContent=`🛒 Купить за ${Z.fmtP(p)}`;
  Z.hideMain();Z.showMain(`🛒 Купить — ${Z.fmtP(p)}`,()=>Z.buyPS(Z._curPsId()));
};
Z._curPsId=function(){const m=location.hash.match(/ps_(\d+)/);return m?m[1]:Z.hist.length?Z.hist[Z.hist.length-1]?.p?.id:null};

Z.renderPD_ST=function(id){
  const el=$('s-product'),g=Z.steam?.[id];if(!g){el.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div class="empty-msg">Игра не найдена</div></div>';return}
  const edsH=(g.eds||[]).map((e,i)=>`<div class="ed${i===0?' on':''}" onclick="Z._pickEd(this,${i})"><div class="ed-dot"></div><span class="ed-n">${Z.esc(e.n)}</span><span class="ed-p">${Z.fmtP(e.p)}</span></div>`).join('');
  el.innerHTML=`<div class="pd">
    ${g.wide||g.header?`<img class="pd-hero" src="${g.wide||g.header}" alt="">`:''}
    <div class="pd-body">
      <div class="pd-title">${Z.esc(g.name)}</div>
      <div class="pd-meta"><span>Steam</span><span>· ${(g.genres||[]).join(', ')}</span>
        ${g.mc?`<span class="pd-tag pd-tag-mc">MC ${g.mc}</span>`:''} ${g.recs?`<span class="pd-tag pd-tag-ok">👍 ${g.recs.toLocaleString()}</span>`:''}
      </div>
      ${g.short?`<div class="pd-desc">${Z.esc(g.short)}</div>`:''}
    </div>
    ${(g.shots||[]).length?`<div class="shots">${g.shots.slice(0,8).map(s=>`<img src="${s}" alt="" loading="lazy">`).join('')}</div>`:''}
    <div class="pd-body" style="padding-top:2px">
      ${edsH?`<div class="sec-t" style="margin-bottom:6px">📦 Издание</div><div class="ed-list">${edsH}</div>`:''}
      <button class="btn btn-primary" onclick="Z.buySteam('${id}')">🛒 Купить за ${Z.fmtP(g.price)}</button>
    </div>
  </div>`;
  Z.showMain(`🛒 Купить — ${Z.fmtP(g.price)}`,()=>Z.buySteam(id));
};

Z.renderPD_XB=function(id){
  const el=$('s-product'),g=Z.xbox?.games?.find(x=>x.id===id);if(!g){el.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div class="empty-msg">Не найдено</div></div>';return}
  const mp=Math.min(...g.vars.map(v=>v.price));
  const varsH=g.vars.map((v,i)=>`<div class="ed${i===0?' on':''}" onclick="Z._pickEd(this,${i})"><div class="ed-dot"></div><span class="ed-n">${Z.esc(v.edn)} · ${v.plat==='one_xs'?'One+Series':v.plat==='series'?'Series X|S':'One'}</span><span class="ed-p">${Z.fmtP(v.price)}</span></div>`).join('');
  el.innerHTML=`<div class="pd">
    ${g.hero?`<img class="pd-hero" src="${g.hero}" alt="">`:''}
    <div class="pd-body">
      <div class="pd-title">${Z.esc(g.n)}</div><div class="pd-meta"><span>Xbox</span></div>
      ${g.desc?`<div class="pd-desc">${Z.esc(g.desc)}</div>`:''}
      ${varsH?`<div class="sec-t" style="margin-bottom:6px">📦 Варианты</div><div class="ed-list">${varsH}</div>`:''}
      <button class="btn btn-primary" onclick="Z.openSite('/xbox')">🛒 Купить от ${Z.fmtP(mp)}</button>
    </div>
  </div>`;
};

/* ── SEARCH ── */
Z.renderSearch=function(){
  $('s-search').innerHTML=`<div class="s-bar" style="position:relative">
    <svg class="s-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
    <input class="s-input" type="search" placeholder="Найти игру, подписку..." oninput="Z._doS(this.value)" autofocus>
  </div><div id="sRes" class="sec"><div class="empty"><div class="empty-ico">🔍</div><div class="empty-msg">Начните вводить название</div></div></div>`;
};
Z._doS=function(q){clearTimeout(Z._searchT);Z._searchT=setTimeout(()=>Z._execS(q),180)};
Z._execS=function(q){
  const out=$('sRes');if(!out)return;
  q=q.trim().toLowerCase();if(q.length<2){out.innerHTML='<div class="empty"><div class="empty-ico">🔍</div><div class="empty-msg">Начните вводить название</div></div>';return}
  const tl='абвгдежзийклмнопрстуфхцчшщэюя';const la='abvgdezhziyklmnoprstufhtschshscheyuya'.match(/.{1,3}/g)||[];
  let ql=q;for(let i=0;i<tl.length;i++)ql=ql.replaceAll(tl[i],la[i]||'');
  let res=[];
  // PS
  if(Z.ps)for(const[id,g]of Object.entries(Z.ps)){
    const nl=g.n.toLowerCase();if(nl.includes(q)||nl.includes(ql))
      res.push({t:'ps',id,n:g.n,p:Z.psP(g.uah),img:Z.psD?.[id]?.edimg?.['0']||'',pl:'PS'});
  }
  // Search index (Steam+Xbox)
  if(Z.searchIdx)for(const it of Z.searchIdx){
    const nl=it[2].toLowerCase();if(nl.includes(q)||nl.includes(ql))
      res.push({t:it[0]==='s'?'steam':'xbox',id:String(it[1]),n:it[2],p:it[3],img:it[4],pl:it[0]==='s'?'Steam':'Xbox'});
  }
  // Subs
  for(const s of SUBS)if(s.n.toLowerCase().includes(q)||s.d.toLowerCase().includes(q))
    res.push({t:'sub',id:s.id,n:s.n,p:s.from,img:CDN+s.img,pl:'AI',u:s.u});
  if(!res.length){out.innerHTML='<div class="empty"><div class="empty-ico">😔</div><div class="empty-msg">Ничего не найдено</div><div class="empty-sub">Попробуйте другой запрос</div></div>';return}
  out.innerHTML=res.slice(0,30).map(r=>`<div class="sc" onclick="${r.t==='sub'?`Z.openSite('${r.u}')`:`Z.go('product',{t:'${r.t}',id:'${r.id}'})`}">
    ${r.img?`<img class="sc-ico" src="${r.img}" alt="" loading="lazy">`:'<div class="sc-ico"></div>'}
    <div class="sc-info"><div class="sc-name">${Z.esc(r.n)}</div><div class="sc-desc">${r.pl}</div></div>
    <div class="sc-price">${Z.fmtP(r.p)}</div></div>`).join('');
};

/* ── FAVS ── */
Z.renderFavs=function(){
  const el=$('s-favs');
  if(!Z.favs.size){el.innerHTML='<div class="empty" style="padding-top:100px"><div class="empty-ico">❤️</div><div class="empty-msg">Пока пусто</div><div class="empty-sub">Нажмите ♡ на карточке игры</div></div>';return}
  let cards='';
  for(const k of Z.favs){const[t,id]=k.split('_');
    if(t==='ps'&&Z.ps?.[id])cards+=Z.psCard(id,Z.ps[id]);
    else if(t==='st'&&Z.steam?.[id])cards+=Z.stCard(id,Z.steam[id]);
    else if(t==='xb'){const g=Z.xbox?.games?.find(x=>x.id===id);if(g)cards+=Z.xbCard(g);}
  }
  el.innerHTML=`<div class="hdr"><div class="hdr-title">Избранное</div><div class="hdr-sub">${Z.favs.size}</div></div>
    <div class="sec"><div class="game-grid">${cards||'<div class="empty"><div class="empty-sub">Загрузите каталоги, чтобы увидеть карточки</div></div>'}</div></div>`;
};

/* ═══ ACTIONS ═══ */
Z.buyPS=function(id){Z.haptic('medium');Z.openSite('/games#'+id)};
Z.buySteam=function(id){Z.haptic('medium');Z.openSite('/steam#'+id)};
Z.openSite=function(path){const u=CDN+path;tg?.openLink?tg.openLink(u):open(u,'_blank')};
Z.openBot=function(sec){
  const start=sec?`start=${sec}`:'start=catalog';
  if(tg){tg.openTelegramLink(`https://t.me/${BOT}?${start}`);tg.close()}
  else open(`https://t.me/${BOT}?${start}`,'_blank');
};

/* ═══ BOOT ═══ */
document.addEventListener('DOMContentLoaded',()=>Z.init());
</script>
