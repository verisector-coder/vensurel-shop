<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ZAMON</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://zamon.app">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.4;
  padding-bottom:calc(60px + env(safe-area-inset-bottom,0px));
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
button,input{font:inherit;border:none;background:none;color:inherit;cursor:pointer}
::-webkit-scrollbar{display:none}

/* ── Tab bar ── */
.tabs{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:flex;height:calc(52px + env(safe-area-inset-bottom,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--tg-theme-bg-color,#fff);border-top:0.5px solid var(--tg-theme-hint-color,#ccc);
}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  color:var(--tg-theme-hint-color,#999);font-size:10px;font-weight:600;transition:.15s}
.tabs button.on{color:var(--tg-theme-button-color,#007aff)}
.tabs svg{width:22px;height:22px}
.tabs button:active{opacity:.6}

/* ── Section ── */
.pad{padding:12px 14px}
.title{font-size:17px;font-weight:700;margin-bottom:8px}
.sub{font-size:13px;color:var(--tg-theme-hint-color,#999)}

/* ── Hero ── */
.hero{padding:20px 16px;background:var(--tg-theme-secondary-bg-color,#f2f2f7);border-bottom:0.5px solid rgba(128,128,128,.15)}
.hero h1{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:4px}
.hero p{font-size:13px;color:var(--tg-theme-hint-color,#999);margin-bottom:10px}
.hero-row{display:flex;gap:12px}
.hero-stat b{font-size:17px;font-weight:800;display:block}
.hero-stat span{font-size:10px;color:var(--tg-theme-hint-color,#999)}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tag{padding:4px 10px;border-radius:100px;font-size:11px;font-weight:600;
  background:var(--tg-theme-button-color,#007aff);color:var(--tg-theme-button-text-color,#fff);opacity:.85}

/* ── Platform grid ── */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcard{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;
  background:var(--tg-theme-secondary-bg-color,#f2f2f7);transition:.1s}
.pcard:active{transform:scale(.97)}
.pico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:#fff;font-size:16px;flex-shrink:0}
.pcard b{font-size:13px;display:block}
.pcard small{font-size:11px;color:var(--tg-theme-hint-color,#999)}

/* ── Game card ── */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{border-radius:12px;overflow:hidden;background:var(--tg-theme-secondary-bg-color,#f2f2f7);transition:.1s}
.gc:active{transform:scale(.97)}
.gc-img{aspect-ratio:3/4;background:#1a1a2e;position:relative;overflow:hidden}
.gc-img img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.gc-img img.ok{opacity:1}
.gc-img .no{display:flex;align-items:center;justify-content:center;height:100%;font-size:32px;color:#666}
.badge{position:absolute;top:5px;left:5px;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:800;color:#fff}
.badge-sale{background:#e11d48}
.badge-pre{background:#bf6800}
.gc-b{padding:7px 9px 9px}
.gc-n{font-size:12px;font-weight:600;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:2px}
.gc-p{font-size:13px;font-weight:700}
.gc-old{font-size:11px;text-decoration:line-through;color:var(--tg-theme-hint-color,#999);margin-right:2px}
.gc-from{font-size:10px;color:var(--tg-theme-hint-color,#999);font-weight:500}
.gc-timer{font-size:10px;color:#e11d48;font-weight:600;margin-top:1px}

/* ── Shelf (horizontal scroll) ── */
.shelf{display:flex;gap:8px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.shelf .gc{flex:0 0 130px;scroll-snap-align:start}

/* ── List item ── */
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:0.5px solid rgba(128,128,128,.12)}
.li:active{background:rgba(128,128,128,.06)}
.li-ico{width:40px;height:40px;border-radius:10px;flex-shrink:0;object-fit:cover;background:var(--tg-theme-secondary-bg-color,#f2f2f7)}
.li-info{flex:1;min-width:0}
.li-name{font-size:14px;font-weight:600}
.li-desc{font-size:11px;color:var(--tg-theme-hint-color,#999);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-price{font-weight:700;font-size:13px;text-align:right;white-space:nowrap}
.li-from{font-size:10px;color:var(--tg-theme-hint-color,#999)}

/* ── Product ── */
.pd{padding-bottom:80px}
.pd-hero{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--tg-theme-secondary-bg-color,#f2f2f7)}
.pd-t{font-size:19px;font-weight:700;letter-spacing:-.2px;margin-bottom:2px}
.pd-meta{font-size:12px;color:var(--tg-theme-hint-color,#999);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pd-desc{font-size:13px;color:var(--tg-theme-hint-color,#666);line-height:1.45;margin-bottom:12px}
.shots{display:flex;gap:6px;overflow-x:auto;padding:0 14px 10px}
.shots img{height:140px;border-radius:8px;flex-shrink:0}

/* Edition / Plan picker */
.opt{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:5px;border-radius:12px;
  border:2px solid rgba(128,128,128,.15);background:var(--tg-theme-secondary-bg-color,#f2f2f7);transition:.12s}
.opt.on{border-color:var(--tg-theme-button-color,#007aff);background:color-mix(in srgb,var(--tg-theme-button-color,#007aff) 8%,transparent)}
.opt-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--tg-theme-hint-color,#ccc);flex-shrink:0;display:grid;place-items:center}
.opt.on .opt-dot{border-color:var(--tg-theme-button-color,#007aff)}
.opt.on .opt-dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--tg-theme-button-color,#007aff)}
.opt-n{flex:1;font-size:13px;font-weight:600}
.opt-p{font-weight:700;font-size:13px}

.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.plan{text-align:center;padding:10px 6px 8px;border-radius:12px;
  border:2px solid rgba(128,128,128,.15);background:var(--tg-theme-secondary-bg-color,#f2f2f7);transition:.12s}
.plan.on{border-color:var(--tg-theme-button-color,#007aff);background:color-mix(in srgb,var(--tg-theme-button-color,#007aff) 8%,transparent)}
.plan b{font-size:14px}
.plan small{display:block;font-size:10px;color:var(--tg-theme-hint-color,#999);line-height:1.2;margin:2px 0 4px;min-height:2.4em}
.plan .pp{font-size:13px;font-weight:700}

/* ── Chips / Filters ── */
.chips{display:flex;gap:5px;overflow-x:auto;padding:4px 14px 8px}
.chip{padding:6px 12px;border-radius:100px;font-size:12px;font-weight:600;white-space:nowrap;flex-shrink:0;
  background:var(--tg-theme-secondary-bg-color,#f2f2f7);color:var(--tg-theme-text-color,#000);transition:.1s}
.chip.on{background:var(--tg-theme-button-color,#007aff);color:var(--tg-theme-button-text-color,#fff)}
.chip:active{transform:scale(.95)}

/* ── Header ── */
.hdr{display:flex;align-items:center;gap:8px;padding:8px 14px;position:sticky;top:0;z-index:50;
  background:var(--tg-theme-bg-color,#fff);border-bottom:0.5px solid rgba(128,128,128,.12)}
.hdr-t{font-size:16px;font-weight:700;flex:1}

/* ── Search ── */
.sbar{padding:8px 14px;position:sticky;top:0;z-index:50;background:var(--tg-theme-bg-color,#fff)}
.sinput{width:100%;padding:8px 12px;border-radius:10px;font-size:14px;
  background:var(--tg-theme-secondary-bg-color,#f2f2f7);color:var(--tg-theme-text-color,#000)}
.sinput::placeholder{color:var(--tg-theme-hint-color,#999)}

/* ── Reviews ── */
.rv{padding:10px 14px;border-bottom:0.5px solid rgba(128,128,128,.1)}
.rv-stars{color:#ffb400;font-size:12px}
.rv-text{font-size:13px;line-height:1.35;margin-top:2px}
.rv-meta{font-size:11px;color:#2ecc71;font-weight:600;margin-top:2px}
.rv-banner{display:flex;align-items:center;gap:12px;padding:14px;margin:8px 14px;border-radius:14px;
  background:var(--tg-theme-button-color,#007aff);color:var(--tg-theme-button-text-color,#fff)}
.rv-banner b{font-size:24px}

/* ── Buttons ── */
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:15px;transition:.1s}
.btn:active{transform:scale(.98)}
.btn-buy{background:var(--tg-theme-button-color,#007aff);color:var(--tg-theme-button-text-color,#fff)}
.btn-sec{background:var(--tg-theme-secondary-bg-color,#f2f2f7)}

/* ── Misc ── */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--tg-theme-hint-color,#999);gap:8px;font-size:13px}
.spin{width:18px;height:18px;border:2px solid rgba(128,128,128,.2);border-top-color:var(--tg-theme-button-color,#007aff);border-radius:50%;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--tg-theme-hint-color,#999)}
.empty b{display:block;font-size:28px;margin-bottom:6px}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--tg-theme-text-color,#000);color:var(--tg-theme-bg-color,#fff);padding:8px 18px;
  border-radius:100px;font-weight:600;font-size:13px;z-index:200;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.trust{display:flex;align-items:center;gap:6px;padding:8px 12px;margin-top:10px;border-radius:10px;
  background:var(--tg-theme-secondary-bg-color,#f2f2f7);font-size:11px;color:var(--tg-theme-hint-color,#999)}
.screen{display:none;min-height:100vh}
.screen.on{display:block}
</style>
</head>
<body>

<div id="s-home" class="screen on"></div>
<div id="s-ps" class="screen"></div>
<div id="s-steam" class="screen"></div>
<div id="s-xbox" class="screen"></div>
<div id="s-subs" class="screen"></div>
<div id="s-gifts" class="screen"></div>
<div id="s-reviews" class="screen"></div>
<div id="s-product" class="screen"></div>
<div id="s-search" class="screen"></div>
<div id="s-favs" class="screen"></div>

<nav class="tabs">
  <button class="on" onclick="Z.tab('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>Главная</button>
  <button onclick="Z.tab('ps')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Каталог</button>
  <button onclick="Z.tab('search')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>Поиск</button>
  <button onclick="Z.tab('favs')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg>Избранное</button>
</nav>
<div id="toast" class="toast"></div>

<!-- Steam & Xbox load via script tags (no CORS) -->
<script>
const tg=window.Telegram?.WebApp,CDN='https://zamon.app',BOT='TarkonGameBot';

/* ── Pricing = zamon.js ── */
const DG={p2:{l:'П2',d:'Общий аккаунт · онлайн',k:.30},p3:{l:'П3',d:'Онлайн + оффлайн',k:.61},p1:{l:'П1',d:'На ваш аккаунт',k:1.25}};
const P1R=[['ua','🇺🇦','Украина'],['tr','🇹🇷','Турция'],['in','🇮🇳','Индия'],['pl','🇵🇱','Польша'],['us','🇺🇸','США']];
const RC={ua:'UAH',tr:'TRY',in:'INR',pl:'PLN',us:'USD'},INR_B=1000/13;

/* ── State ── */
const Z={scr:'home',hist:[],favs:new Set(),UAH_RUB:1.78,
  RATES:{USD:1,RUB:80,UAH:45,TRY:47.5,INR:95,PLN:3.74},
  ps:null,psD:null,steam:null,shelves:null,xbox:null,reviews:null,si:null,
  _mb:null,sel:{plan:'p2',ed:0,cons:'PS5',reg:0,pid:null}};

/* ── Subs ── */
const SUBS=[
  {n:'ChatGPT',d:'Go · Plus · Pro',img:'/img/subs/chatgpt.png',u:'/podpiska-chatgpt',from:669},
  {n:'Claude',d:'Pro · Max 5x · Max 20x',img:'/img/subs/claude.png',u:'/podpiska-claude',from:2279},
  {n:'Midjourney',d:'Генерация изображений',img:'/img/subs/midjourney.png',u:'/podpiska-midjourney',from:1199},
  {n:'Cursor',d:'AI-помощник для кода',img:'/img/subs/cursor.png',u:'/podpiska-cursor',from:2279},
  {n:'Perplexity',d:'AI-поисковик Pro',img:'/img/subs/perplexity.png',u:'/podpiska-perplexity',from:2279},
  {n:'Spotify Premium',d:'Музыка без рекламы',img:'/img/subs/spotify.png',u:'/subs',from:199},
  {n:'Telegram Premium',d:'Подписка',img:'/img/subs/telegram.png',u:'/subs',from:299},
  {n:'YouTube Premium',d:'Без рекламы + Music',img:'/img/subs/youtube.png',u:'/subs',from:199},
];

/* ═══ HELPERS ═══ */
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const fmt=p=>p==null?'—':(Math.round(p).toLocaleString('ru-RU')+' ₽');
const hap=s=>{try{tg?.HapticFeedback?.impactOccurred(s||'light')}catch(e){}};
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)};

/* Pricing formulas = site */
Z.dgP=(uah,k)=>Math.max(300,Math.round(uah*Z.UAH_RUB*k/10)*10);
Z.p1P=(loc,rk,m)=>{const rc=RC[rk];if(!loc||!rc||!Z.RATES[rc])return null;const r=rc==='INR'?INR_B:Z.RATES[rc];return Math.max(300,Math.round(loc/r*1.25*(m||1)*Z.RATES.RUB/10)*10)};
Z.zmn=(id,pl,ei,c)=>'https://pay.zamon.app/zpay?c=zmn_'+id+'_'+pl+'_'+(ei||0)+'_'+(c==='PS4'?'ps4':'ps5');

/* ═══ INIT ═══ */
Z.init=()=>{
  if(tg){tg.ready();tg.expand();try{tg.disableVerticalSwipes?.()}catch(e){}try{tg.requestFullscreen?.()}catch(e){}
    tg.BackButton.onClick(()=>Z.back());
    tg.CloudStorage?.getItem('zfav',(e,v)=>{if(v)try{Z.favs=new Set(JSON.parse(v))}catch(x){}});
  }
  Z.show('home');Z.loadRates();Z.loadPS();Z.loadSI();
};

Z.loadRates=async()=>{try{const d=await(await fetch('https://open.er-api.com/v6/latest/USD')).json();
  if(d?.rates){const r=d.rates;['RUB','UAH','TRY','INR','PLN'].forEach(c=>{if(r[c])Z.RATES[c]=r[c]});
    if(r.RUB&&r.UAH)Z.UAH_RUB=r.RUB/r.UAH}}catch(e){}};

Z.fetchJ=async u=>{try{return await(await fetch(u)).json()}catch(e){
  try{return await(await fetch('https://corsproxy.io/?'+encodeURIComponent(u))).json()}catch(e2){return null}}};
Z.loadS=u=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});

Z.loadPS=async()=>{if(Z.ps)return;const c=await Z.fetchJ(CDN+'/ru-catalog.json');
  Z.ps=c?.games||c||{};Z.fetchJ(CDN+'/ps-plus-deals.json').then(d=>{Z.psDeals=d}).catch(()=>{});
  Z.fetchJ(CDN+'/games-data.json').then(d=>{Z.psD=d;if(Z.scr==='home')Z.show('home')}).catch(()=>{})};
Z.loadSteam=async()=>{if(Z.steam)return;try{await Z.loadS(CDN+'/steam-catalog.js');Z.steam=window.CATALOG||{};Z.shelves=window.SHELVES||{}}catch(e){Z.steam={}}};
Z.loadXbox=async()=>{if(Z.xbox)return;try{await Z.loadS(CDN+'/xbox-catalog.js');Z.xbox=window.XBOX||{}}catch(e){Z.xbox={}}};
Z.loadSI=async()=>{Z.si=await Z.fetchJ(CDN+'/search-index.json');Z.si=Z.si?.items||[]};
Z.loadRev=async()=>{if(Z.reviews)return;Z.reviews=await Z.fetchJ(CDN+'/reviews.json')};

/* ═══ NAV ═══ */
Z.go=(s,p)=>{Z.hist.push({s:Z.scr,y:scrollY,p:Z._lastP});Z._lastP=p;Z.show(s,p)};
Z.show=(s,p)=>{document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  Z.scr=s;const el=$('s-'+s);if(el)el.classList.add('on');
  const R={home:Z.rHome,ps:Z.rPS,steam:Z.rSteam,xbox:Z.rXbox,subs:Z.rSubs,
    gifts:Z.rGifts,reviews:Z.rRev,product:()=>Z.rProd(p),search:Z.rSearch,favs:Z.rFavs};
  R[s]?.();scrollTo(0,0);Z.hideM();
  tg?.BackButton?.[Z.hist.length?'show':'hide']()};
Z.back=()=>{if(!Z.hist.length)return;const h=Z.hist.pop();Z._lastP=h.p;Z.show(h.s,h.p);setTimeout(()=>scrollTo(0,h.y),20)};
Z.tab=t=>{const m={home:'home',ps:'ps',search:'search',favs:'favs'};Z.hist=[];Z.show(m[t]||t);
  document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',['home','ps','search','favs'][i]===t));
  tg?.BackButton?.hide()};

Z.showM=(t,cb)=>{if(!tg?.MainButton)return;tg.MainButton.setText(t);tg.MainButton.show();if(Z._mb)tg.MainButton.offClick(Z._mb);tg.MainButton.onClick(cb);Z._mb=cb};
Z.hideM=()=>{if(!tg?.MainButton)return;tg.MainButton.hide();if(Z._mb){tg.MainButton.offClick(Z._mb);Z._mb=null}};

/* ═══ FAVS ═══ */
Z.isFav=k=>Z.favs.has(k);
Z.toggleFav=(k,ev)=>{ev?.stopPropagation();ev?.preventDefault();const had=Z.favs.has(k);
  had?Z.favs.delete(k):Z.favs.add(k);hap('medium');toast(had?'Убрано':'❤️ В избранном');
  document.querySelectorAll(`[data-fk="${k}"]`).forEach(b=>b.classList.toggle('on',!had));
  const j=JSON.stringify([...Z.favs]);tg?.CloudStorage?tg.CloudStorage.setItem('zfav',j):localStorage.setItem('zfav',j)};

/* ═══ CARD BUILDERS ═══ */
Z.favB=k=>`<button class="badge${Z.isFav(k)?' on':''}" data-fk="${k}" style="right:5px;bottom:5px;left:auto;top:auto;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;cursor:pointer;padding:0" onclick="Z.toggleFav('${k}',event)"><svg viewBox="0 0 24 24" width="13" height="13" fill="${Z.isFav(k)?'#ff375f':'none'}" stroke="${Z.isFav(k)?'#ff375f':'#fff'}" stroke-width="2.2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 000-7.78z"/></svg></button>`;

Z.timer=end=>{const ms=end*1000-Date.now();if(ms<=0)return'';const h=Math.floor(ms/36e5),d=Math.floor(h/24);return d>3?d+' дн':d>=1?d+'д '+h%24+'ч':h+'ч'};

Z.psC=(id,g)=>{
  const p=Z.dgP(g.uah,.30),deal=g.deal&&g.deal.end*1000>Date.now(),dp=deal?Z.dgP(g.deal.disc,.30):null,
    pct=deal?Math.round((1-g.deal.disc/g.deal.full)*100):0,

Z.psFilt='all';Z.psSort='def';
Z.rPS=()=>{const el=$('s-ps');

Z.rProdPS=id=>{
  const el=$('s-product'),g=Z.ps?.[id];if(!g){el.innerHTML='<div class="empty"><b>🔍</b>Игра не найдена</div>';return}
  const d=Z.psD?.[id]||{},hero=d.hero||d.shots?.[0]||d.edimg?.['0']||'',
    eds=g.eds||[['Standard',g.uah]],isPre=!!g.pre;
  Z.sel={plan:isPre?'p3':'p2',ed:0,cons:'PS5',reg:0,pid:id};

  const edsH=eds.length>1?`<div class="title" style="font-size:14px">📦 Издание</div>${eds.map((e,i)=>{
    const p=Z.dgP(e[1],.30);return`<div class="opt${i===0?' on':''}" onclick="Z._pEd(${i})"><div class="opt-dot"></div><div class="opt-n">${esc(e[0])}</div><div class="opt-p">${fmt(p)}</div></div>`}).join('')}<div style="height:8px"></div>`:'';

  const modes=isPre?['p3']:['p2','p3'],u0=eds[0][1];
  const modesH=modes.map(k=>{const m=DG[k];return`<div class="plan${k===Z.sel.plan?' on':''}" onclick="Z._pPlan('${k}')"><b>${m.l}</b><small>${m.d}</small><div class="pp">${fmt(Z.dgP(u0,m.k))}</div></div>`}).join('');

  const p1H=P1R.map(([rk,fl,rn],ri)=>{const loc=d.reg?.[rk],
    p=loc!=null?Z.p1P(loc,rk):rk==='ua'?Z.dgP(u0,1.25):null;if(p==null)return'';
    return`<div class="opt" onclick="Z._pP1(${ri})"><div class="opt-dot"></div><div class="opt-n">${fl} ${esc(rn)}</div><div class="opt-p">${fmt(p)}</div></div>`}).filter(Boolean).join('');

  const cp=Z._cp();
  el.innerHTML=`<div class="pd">${hero?`<img class="pd-hero" src="${hero}" loading="lazy">`:''}<div class="pad">
    <div class="pd-t">${esc(g.n)}</div><div class="pd-meta"><span>${g.ps4?'PS4/PS5':'PS5'}</span>${d.mode?`<span>· ${d.mode}</span>`:''}${g.deal?`<span style="color:#e11d48;font-weight:700">-${Math.round((1-g.deal.disc/g.deal.full)*100)}%</span>`:''}</div>
    ${d.desc?`<div class="pd-desc">${esc(d.desc)}</div>`:''}</div>
    ${(d.shots||[]).length?`<div class="shots">${d.shots.slice(0,6).map(s=>`<img src="${s}" loading="lazy">`).join('')}</div>`:''}
    <div class="pad">${(d.why||[]).length?`<div class="title" style="font-size:14px">🎯 Почему стоит сыграть</div>${d.why.map(w=>`<div style="padding:8px 10px;background:var(--tg-theme-secondary-bg-color,#f2f2f7);border-radius:10px;margin-bottom:4px"><b style="font-size:13px">${esc(w[0])}</b><div style="font-size:12px;color:var(--tg-theme-hint-color)">${esc(w[1])}</div></div>`).join('')}<div style="height:10px"></div>`:''
    }${edsH}<div class="title" style="font-size:14px">💰 Выдача аккаунта — дешевле</div>
      <div class="plan-grid" style="grid-template-columns:repeat(${modes.length},1fr)">${modesH}</div>
      ${isPre?'<div style="font-size:11px;color:var(--tg-theme-hint-color);margin-bottom:8px">П2 станет доступен после релиза</div>':''}
      ${p1H?`<div class="title" style="font-size:14px">🔑 На ваш аккаунт (П1) — навсегда</div><div id="p1list">${p1H}</div>`:''
    }<div class="trust"><span>⚡</span> Выдача 10–15 мин · Не выдали — вернём деньги · СБП / крипта</div>
      <button class="btn btn-buy" style="margin-top:12px" id="buyBtn" onclick="Z.buyPS()">Купить за ${fmt(cp)}</button>
    </div></div>`;
  Z.showM('Купить — '+fmt(cp),()=>Z.buyPS())};

Z._cp=()=>{const s=Z.sel,g=Z.ps?.[s.pid],d=Z.psD?.[s.pid]||{};if(!g)return 0;
  const eds=g.eds||[['Standard',g.uah]],uah=eds[s.ed]?.[1]||eds[0][1];
  if(s.plan==='p1'){const rk=P1R[s.reg]?.[0]||'ua',loc=d.reg?.[rk];
    return loc!=null?Z.p1P(loc,rk):(rk==='ua'?Z.dgP(uah,1.25):Z.dgP(uah,1.25))}
  return Z.dgP(uah,DG[s.plan]?.k||.30)};
Z._upd=()=>{const p=Z._cp();const b=$('buyBtn');if(b)b.textContent='Купить за '+fmt(p);Z.hideM();Z.showM('Купить — '+fmt(p),()=>Z.buyPS())};
Z._pEd=i=>{Z.sel.ed=i;hap();document.querySelectorAll('.opt').forEach((e,j)=>j<(Z.ps[Z.sel.pid]?.eds||[['']]).length&&e.classList.toggle('on',j===i));Z._upd()};
Z._pPlan=k=>{Z.sel.plan=k;hap();document.querySelectorAll('.plan-grid .plan').forEach(e=>e.classList.remove('on'));
  event.currentTarget.classList.add('on');document.querySelectorAll('#p1list .opt').forEach(e=>e.classList.remove('on'));Z._upd()};
Z._pP1=(ri)=>{Z.sel.plan='p1';Z.sel.reg=ri;hap();document.querySelectorAll('.plan-grid .plan').forEach(e=>e.classList.remove('on'));
  document.querySelectorAll('#p1list .opt').forEach((e,j)=>e.classList.toggle('on',j===ri));Z._upd()};

Z.rProdST=id=>{const el=$('s-product'),g=Z.steam?.[id];if(!g){el.innerHTML='<div class="empty"><b>🔍</b>Не найдено</div>';return}
  el.innerHTML=`<div class="pd">${g.wide||g.header?`<img class="pd-hero" src="${g.wide||g.header}">`:''}<div class="pad">
    <div class="pd-t">${esc(g.name)}</div><div class="pd-meta"><span>Steam</span>${g.genres?`<span>· ${g.genres.join(', ')}</span>`:''}${g.mc?`<span style="color:#4caf50;font-weight:700">MC ${g.mc}</span>`:''}</div>

/* SEARCH */
Z.rSearch=()=>{$('s-search').innerHTML=`<div class="sbar"><input class="sinput" type="search" placeholder="Найти игру, подписку…" oninput="Z._doS(this.value)" autofocus></div><div id="sR" class="pad"><div class="empty"><b>🔍</b>Введите название</div></div>`};
let _st;Z._doS=q=>{clearTimeout(_st);_st=setTimeout(()=>Z._exS(q),200)};
Z._exS=q=>{const o=$('sR');if(!o)return;q=q.trim().toLowerCase();if(q.length<2){o.innerHTML='<div class="empty"><b>🔍</b>Введите название</div>';return}
  let r=[];

  if(Z.si)for(const it of Z.si){if(it[2].toLowerCase().includes(q))r.push({t:it[0]==='s'?'st':'xb',id:String(it[1]),n:it[2],p:it[3],img:it[4],pl:it[0]==='s'?'Steam':'Xbox'})}
  for(const s of SUBS)if(s.n.toLowerCase().includes(q))r.push({t:'sub',n:s.n,p:s.from,img:CDN+s.img,pl:'AI',u:s.u});
  if(!r.length){o.innerHTML='<div class="empty"><b>😔</b>Ничего не найдено</div>';return}
  o.innerHTML=r.slice(0,25).map(x=>`<div class="li" onclick="${x.t==='sub'?`Z.openS('${x.u}')`:`Z.go('product',{t:'${x.t}',id:'${x.id}'})`}">
    ${x.img?`<img class="li-ico" src="${x.img}" loading="lazy">`:'<div class="li-ico"></div>'}
    <div class="li-info"><div class="li-name">${esc(x.n)}</div><div class="li-desc">${x.pl}</div></div>
    <div class="li-price">${fmt(x.p)}</div></div>`).join('')};

  let c='';for(const k of Z.favs){const[t,id]=k.split('_');
    if(t==='ps'&&Z.ps?.[id])c+=Z.psC(id,Z.ps[id]);
    else if(t==='st'&&Z.steam?.[id])c+=Z.stC(id,Z.steam[id]);
    else if(t==='xb'){const g=Z.xbox?.games?.find(x=>x.id===id);if(g)c+=Z.xbC(g)}}
  el.innerHTML=`<div class="hdr"><div class="hdr-t">Избранное</div><div class="sub">${Z.favs.size}</div></div><div class="pad"><div class="ggrid">${c||'<div class="empty">Загрузите каталоги</div>'}</div></div>`};

/* ACTIONS */
Z.buyPS=()=>{hap('medium');const s=Z.sel;let pc=s.plan;
  if(pc==='p1')pc='p1'+['u','t','i','p','s'][s.reg||0];
  const url=Z.zmn(s.pid,pc,s.ed,s.cons);Z.openL(url)};
Z.openS=p=>Z.openL(CDN+p);
Z.openL=u=>{tg?.openLink?tg.openLink(u):open(u,'_blank')};
Z.openBot=s=>{if(tg){tg.openTelegramLink(`https://t.me/${BOT}?start=${s||'catalog'}`);tg.close()}else open(`https://t.me/${BOT}?start=${s||'catalog'}`)};

document.addEventListener('DOMContentLoaded',()=>Z.init());
</script>
</body>
</html>
